services:
  habits-db:
    container_name: habits-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: habits
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: habits
    volumes:
      - habits_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U habits -d habits"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  habits:
    container_name: habits
    build: .
    restart: unless-stopped
    depends_on:
      habits-db: {condition: service_healthy}
    ports: ["7370:8000"]
    environment:
      DATABASE_URL: postgresql://habits:${POSTGRES_PASSWORD}@habits-db:5432/habits
      SECRET_KEY: ${SECRET_KEY}
      EDIT_PASSWORD: ${EDIT_PASSWORD}
      TZ: Europe/Amsterdam
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
volumes:
  habits_db:
