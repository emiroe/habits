<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1a1c"><title>Habits</title>
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg?v=3"><link rel="icon" href="/favicon.ico?v=3" sizes="any">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png?v=3">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Habits"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
@font-face{font-family:Raleway;src:url(/static/fonts/Raleway.ttf) format('truetype');font-weight:100 900;font-display:swap}
:root{color-scheme:dark;--bg:#1a1a1c;--panel:#2a2a2c;--row:#343436;--nav:#1b1b1d;--card:#2a2a2c;--card2:#363639;--line:#3a3a3d;--txt:#f4f4f5;--dim:#8c8c92;--ac:#1e90ff;--ac2:#4aa8ff;--sh:none}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}html{background:var(--bg)}
body.t-today{min-height:100dvh}
body{font-variant-numeric:lining-nums;color:var(--txt);font:16px/1.35 Raleway,Lato,"Helvetica Neue",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
main{max-width:520px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top)) 16px 20px}
main.today{padding:0 16px}
button,input{font-variant-numeric:lining-nums}
button{font:inherit;font-variant-numeric:lining-nums;color:inherit;cursor:pointer;border:0;background:none}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;align-items:center;margin-bottom:6px}
.top h1{flex:1;text-align:center;margin:0;font-size:21px;font-weight:700}
.ib{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--txt)}
.ib svg.i{width:26px;height:26px;stroke-width:2.2}
.sec{margin:18px 0 8px;font-size:13px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.07em}
/* date strip */
.sky{background:var(--bg);margin:0 -16px;padding:calc(8px + env(safe-area-inset-top)) 16px 0}
.strip{display:flex;overflow-x:auto;scrollbar-width:none;padding-top:2px}
.strip::-webkit-scrollbar{display:none}
.dy{flex:0 0 11.111%;display:flex;flex-direction:column;align-items:center;gap:9px;padding:11px 0 13px;border-radius:30px;color:#9a9a9f}
.dy span{font-size:12px;font-weight:300;text-transform:uppercase;letter-spacing:.02em}
.dy b{font-size:15px;font-weight:300;color:#e8e8ea}
.dy.td span,.dy.td b{font-weight:800;color:#fff}
.dy.sel{background:#343436}
.dy.fut{opacity:.55;pointer-events:none}
.scene{display:block;width:calc(100% + 32px);height:150px;margin:6px -16px 0}
.panel{background:var(--panel);margin:0 -16px;padding:0 16px 120px;min-height:calc(100vh - 330px)}
/* scene: every body is always in the SVG and moves between day parts */
.scene .sun,.scene .moon,.scene .stars,.scene .birds,.scene .beam{transition:transform .5s cubic-bezier(.3,.8,.3,1),opacity .35s ease}
.scene .sun{transform:translate(195px,196px) scale(1);opacity:0}
.scene[data-p=morning] .sun{transform:translate(195px,136px) scale(1);opacity:1}
.scene[data-p=afternoon] .sun{transform:translate(128px,50px) scale(.47);opacity:1}
.scene[data-p=evening] .sun{transform:translate(70px,180px) scale(.47);opacity:0}
.scene .beam{opacity:0}.scene[data-p=afternoon] .beam{opacity:.1}
.scene .moon{transform:translateY(96px);opacity:0}.scene[data-p=evening] .moon{transform:translateY(0);opacity:1;transition-delay:.08s}
.scene .stars{opacity:0}.scene[data-p=evening] .stars{opacity:1;transition-delay:.22s}
.scene .birds{opacity:0;transform:translateX(-40px)}.scene[data-p=all] .birds{opacity:1;transform:translateX(0)}
.panel.fx .grp,.panel.fx .hw,.panel.fx .empty{animation:fadeup .18s ease both}
@keyframes fadeup{from{opacity:0;transform:translateY(8px)}}
/* period carousel (loops, selected one centred) */
.pf{display:flex;justify-content:center;align-items:center;gap:2px;padding:2px 0 14px;margin:0 -16px}
.pf button{flex:none;padding:8px 14px;border-radius:20px;color:#8c8c92;font-size:14px;font-weight:300;white-space:nowrap}
@media(max-width:350px){.pf button{padding:8px 9px;font-size:13px}}
.pf button.on{background:#363638;color:#fff;font-weight:400}
.grp{text-align:center;color:#9a9a9f;font-size:13px;font-weight:300;margin:10px 0 8px}
/* habit rows */
.h{display:flex;align-items:stretch;background:var(--card);border-radius:14px;margin-bottom:8px;position:relative;transition:opacity .2s}
.panel .h{background:var(--row)}
.h .tx{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:9px 8px 9px 14px;text-align:left}
.ic{width:1.05em;height:1.05em;display:block;fill:currentColor;stroke:none;margin:auto}.ic .s{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.h .em{font-size:24px;width:30px;text-align:center;flex:none;line-height:1}
.h .nm{min-width:0}
.h .nm b{display:block;font-weight:300;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h .nm small{display:block;font-size:13px;font-weight:300;color:#b0b0b5;margin-top:0}
.h .nm small i{font-style:normal;margin-right:7px;font-size:12px;vertical-align:1px}
.h .cnt{flex:none;min-width:84px;padding:6px 16px 6px 8px;text-align:right}
.h .cnt b{font-size:17px;font-weight:700}.h .cnt i{font-style:normal;font-size:17px;font-weight:300}
.h .cnt small{display:block;color:#b0b0b5;font-size:13px;line-height:1.2;font-weight:300}
.h.done .nm b{color:#8c8c92}
.h.skip{opacity:.5}
.cnt:active{transform:scale(.94)}
.hw{position:relative;border-radius:14px;margin-bottom:8px;overflow:hidden}
.hw .h{margin-bottom:0;position:relative;z-index:1;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.hw .h.snap{transition:transform .22s ease-out}
.hw .rv{position:absolute;inset:0;display:flex;align-items:center;padding:0 22px;font-weight:700;font-size:15px;opacity:0;transition:opacity .1s}
.hw .rv.l{background:#30d158;color:#fff;justify-content:flex-start}.hw .rv.r{background:#5b5b60;color:#fff;justify-content:flex-end}
.hw.sr .rv.l,.hw.sl .rv.r{opacity:1}
.hw .rv svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;margin-right:8px}
.hw .rv.r svg{margin:0 0 0 8px}
.pop{animation:pop .35s}@keyframes pop{40%{transform:scale(1.25)}}
.cf{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none;animation:cf .7s ease-out forwards;z-index:30}
@keyframes cf{to{transform:translate(var(--x),var(--y)) scale(.3);opacity:0}}
.empty{text-align:center;color:#b8b8bd;padding:34px 10px;font-size:22px;font-weight:300;line-height:1.35}.empty svg{display:block;margin:0 auto 22px;width:260px;height:auto}
/* manage list */
.mg .sub{font-size:12px;color:var(--dim);margin-top:2px}
.mg .mv{display:flex;flex-direction:column;justify-content:center;padding:0 10px}
.mg .mv button{color:var(--dim);font-size:15px;padding:4px 8px}
/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--nav);border-radius:26px 26px 0 0;padding:10px 0 calc(8px + env(safe-area-inset-bottom));z-index:20}
nav div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:center}
nav .tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:300;color:#8c8c92;padding:2px 0}
nav .tab.on{color:var(--ac)}
nav .plus{justify-self:center;width:58px;height:58px;border-radius:50%;background:var(--ac);color:#fff;font-size:34px;font-weight:300;line-height:1;margin-top:-38px;box-shadow:0 0 0 10px var(--nav)}

/* top bar extras */
.top .lt{width:80px;display:flex}.top .rt{width:80px;display:flex;justify-content:flex-end}
.ib.spin svg{animation:spin .6s linear}@keyframes spin{to{transform:rotate(360deg)}}
/* timer habits */
.h .tmr{flex:none;width:88px;border-radius:0 14px 14px 0;background:#454548;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:8px 6px}
.h .tmr svg{width:32px;height:32px}.h .tmr small{font-size:16px;font-weight:300;color:#f4f4f5}.h .tmr .run{color:var(--ac);font-weight:600;font-variant-numeric:tabular-nums lining-nums}
.tbig{text-align:center;font-size:64px;font-weight:200;letter-spacing:.02em;margin:10px 0 0;font-variant-numeric:tabular-nums lining-nums}.tbig.go{color:var(--ac)}
.tsub{text-align:center;color:var(--dim);margin-bottom:14px}.trow{display:flex;gap:10px}.trow .btn{margin-top:0}
.note{color:#f5b700;font-size:14px}
/* full-screen pages */
.pg{position:fixed;inset:0;background:var(--panel);z-index:60;overflow:auto;padding-bottom:calc(36px + env(safe-area-inset-bottom));animation:pgin .2s ease}
@keyframes pgin{from{opacity:0;transform:translateY(14px)}}
.pgbar{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:70px 1fr 70px;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--panel)}
.pgbar b{text-align:center;font-weight:700;font-size:17px}
.pgbar .pb{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--txt)}.pgbar .pb svg.i{width:26px;height:26px;stroke-width:2.2}
.pgbar .save{justify-self:end;color:var(--ac);font-weight:600;font-size:17px;padding:10px 6px}
.pgbody{max-width:520px;margin:0 auto;padding:6px 16px 40px}
.cd{background:#333335;border-radius:18px;margin-bottom:10px;overflow:hidden}.cd.pad{padding:14px}
.hl{height:1px;background:#434346}
.fi{display:block;width:100%;background:none;border:0;color:var(--txt);font:300 18px Raleway,sans-serif;padding:14px 18px;outline:0;resize:none}.fi::placeholder{color:#7d7d83}
.tl2{display:flex;gap:10px;margin-bottom:10px}
.tl2 .tl{flex:1;height:54px;border-radius:18px;background:#333335;display:flex;align-items:center;justify-content:center;font-size:28px}
.tl2 .tl i{display:block;width:28px;height:28px;border-radius:50%}
.rw{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:0 18px;min-height:54px;font-size:18px;font-weight:300;text-align:left}
.rw .dd,.gl{color:var(--txt)}.rw .dd{display:flex;align-items:center;gap:8px;font-size:17px}
.ch{width:20px;height:20px;fill:none;stroke:#9a9a9f;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tg{flex:none;width:50px;height:30px;border-radius:15px;background:#4a4a4d;position:relative;transition:background .2s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s}
.tg.on{background:var(--ac)}.tg.on::after{transform:translateX(20px);background:var(--acf,#fff)}
.seg{display:flex;background:#4a4a4d;border-radius:20px;margin:10px 14px 8px;padding:0}.seg button{flex:1;padding:9px;border-radius:20px;font-size:16px;font-weight:300}.seg .on{background:var(--ac);color:var(--acf,#fff)}
.gl{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 14px 12px;padding:0 16px;height:48px;border-radius:14px;background:#454548;font-size:18px;font-weight:300;width:calc(100% - 28px);text-align:left}
.exp{padding:4px 14px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.exp .chip2{padding:9px 16px;border-radius:20px;background:#4a4a4d;font-size:15px;font-weight:300}.exp .chip2.on{background:var(--ac);color:var(--acf,#fff)}.exp .chip2.wide{flex:1 1 100%;text-align:center}
.exp .wd2{flex:1;min-width:0;max-width:40px;aspect-ratio:1;height:auto;border-radius:50%;background:#4a4a4d;font-size:14px;font-weight:300}.exp .wd2.on{background:var(--ac);color:var(--acf,#fff)}
.mini{background:#454548;border:0;border-radius:14px;color:var(--txt);font:300 17px Raleway,sans-serif;padding:10px 12px;width:84px;outline:0}.mini.wide{flex:1;width:auto;min-width:120px}
.dt{background:#454548;border:0;border-radius:14px;color:var(--txt);font:300 17px Raleway,sans-serif;padding:9px 12px;outline:0}
.del{display:block;width:100%;margin-top:4px;padding:15px;border-radius:18px;background:#333335;color:#ff453a;font-size:19px;font-weight:400}
/* pick a new one */
.search{display:flex;align-items:center;gap:14px;background:#3a3a3d;border-radius:18px;padding:0 20px;margin:0 0 16px;height:56px;color:#8c8c92}
.search input{flex:1;background:none;border:0;color:var(--txt);font:300 20px Raleway,sans-serif;outline:0;min-width:0}.search svg{width:28px;height:28px;flex:none}
.cat{display:block;position:relative;width:100%;text-align:left;background:#333335;border-radius:22px;padding:20px 22px;margin-bottom:11px;overflow:hidden;min-height:92px}
.cat b{display:block;font-weight:300;font-size:21px;max-width:60%}.cat span{display:block;font-size:15px;font-weight:300;color:#b0b0b5;margin-top:5px;max-width:58%}
.cat .art{position:absolute;right:14px;top:50%;transform:translateY(-50%) rotate(-5deg);font-style:normal;font-size:50px;letter-spacing:-9px;white-space:nowrap}
.art svg{display:block;width:100%;height:100%}.cat .art:has(svg){width:150px;top:6px;bottom:6px;right:8px;font-size:0;transform:none;pointer-events:none}.cathead .art:has(svg){width:170px;height:112px;font-size:0;top:calc(14px + env(safe-area-inset-top))}
.cta{position:fixed;left:0;right:0;bottom:0;padding:26px 28px calc(22px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--panel) 40%);z-index:4}
.yel{display:block;width:100%;max-width:480px;margin:0 auto;background:#f6b92b;color:#222;font-weight:700;font-size:19px;border-radius:32px;padding:20px}
.pickbody{padding-bottom:130px}
.cathead{background:#1b1b1d;padding:calc(10px + env(safe-area-inset-top)) 16px 20px;position:relative;min-height:158px}
.cathead .pb{width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--txt)}.cathead .pb svg.i{width:26px;height:26px;stroke-width:2.2}
.cathead h1{margin:30px 0 0;font-size:30px;font-weight:800;max-width:62%;line-height:1.15}
.cathead .art{position:absolute;right:16px;top:calc(24px + env(safe-area-inset-top));font-style:normal;font-size:70px;letter-spacing:-12px}
.cnt2{color:#8c8c92;font-size:16px;font-weight:300;padding:18px 20px 4px}
.tr{display:flex;align-items:center;gap:18px;width:100%;padding:15px 20px;text-align:left}
.tr .em{font-size:36px;width:44px;text-align:center;flex:none}.tr b{display:block;font-weight:300;font-size:21px}.tr small{display:block;font-size:15px;font-weight:300;color:#b0b0b5;margin-top:2px}
.empty2{text-align:center;color:#9a9a9f;padding:30px 10px;font-weight:300}
.mgrid{flex:1 1 100%;display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.mgrid .wd2{width:100%;height:auto;aspect-ratio:1}
.ivs{padding-bottom:6px}.ivl{display:flex;align-items:center;gap:14px;padding:8px 14px;border-top:1px solid #3c3c3f}.ivl:first-child{border-top:0}
.ivm{width:100px;height:38px;border-radius:12px;background:#4a4a4d;font-size:18px;font-weight:300;flex:none}.ivt{flex:1;text-align:left;font-size:18px;font-weight:300;color:#b0b0b5;padding:8px 0}
.ivx{width:36px;height:36px;color:#8c8c92;flex:none}.ivx svg.i{width:20px;height:20px}
.ivadd{display:block;width:100%;text-align:left;padding:13px 18px;color:var(--ac);font-size:18px;font-weight:300;border-top:1px solid #3c3c3f}
.ov.wh{z-index:90;align-items:flex-end;background:rgba(0,0,0,.72)}.whs{width:100%;max-width:560px;background:#303032}
.whb{display:flex;justify-content:space-between;padding:22px 22px;background:#1c1c1e;font-size:21px}.whb button{font-size:21px;font-weight:500;color:#fff;padding:2px 4px}
.whw{position:relative;display:flex;height:220px;overflow:hidden;padding:0 14px calc(10px + env(safe-area-inset-bottom));box-sizing:content-box}
.wcol{flex:1;height:220px;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;text-align:center;padding:88px 0;box-sizing:border-box;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.wcol::-webkit-scrollbar{display:none}.wcol div{height:44px;line-height:44px;scroll-snap-align:center;font-size:25px;font-weight:300}
.wfix{flex:1;display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:300;height:220px}
.whband{position:absolute;left:12px;right:12px;top:88px;height:44px;background:rgba(255,255,255,.09);border-radius:12px;pointer-events:none}
/* sheets */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{margin:0 0 14px;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.sheet h2 .x{margin-left:auto;font-size:16px;width:34px;height:34px;border-radius:50%;background:var(--card2);color:var(--dim)}
label.l{display:block;font-size:12px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 6px}
input.t{width:100%;font:inherit;padding:13px 14px;border-radius:16px;border:2px solid transparent;background:var(--card);color:var(--txt);box-shadow:var(--sh)}
input.t:focus{outline:0;border-color:var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 2px transparent}
.sw.on{border-color:var(--bg);box-shadow:0 0 0 3px var(--txt)}
.emg{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;background:var(--card);border-radius:16px;padding:8px;max-height:210px;overflow:auto}
.emg button{font-size:24px;border-radius:12px;padding:4px 0}.emg button.on{background:var(--card2);box-shadow:inset 0 0 0 2px var(--ac)}
.chip{padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--sh);font-weight:600;font-size:14px}
.chip.on{background:var(--ac);color:#fff}
.wd{width:42px;height:42px;padding:0;border-radius:50%}
.btn{padding:14px;border-radius:18px;font-weight:700;width:100%;margin-top:10px;background:var(--card);box-shadow:var(--sh)}
.btn.pri{background:var(--ac);color:#fff}.btn.red{color:#e5484d}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tile{background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--sh)}
.tile b{display:block;font-size:24px;letter-spacing:-.02em}.tile span{font-size:12px;color:var(--dim);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--card);padding:10px;border-radius:20px;box-shadow:var(--sh)}
.cal .hd{text-align:center;font-size:11px;font-weight:700;color:var(--dim)}
.cal .c{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--dim);cursor:pointer}
.cal .c.off{opacity:.3}.cal .c.ok{color:#fff}.cal .c.sk{border:2px dashed var(--dim)}.cal .c.miss{background:var(--card2)}.cal .c.td{box-shadow:0 0 0 2px var(--ac)}
.cal .c.fu{opacity:.25;cursor:default}
.mh{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px;font-weight:700}
.mh button{width:34px;height:34px;border-radius:50%;background:var(--card);box-shadow:var(--sh)}
.step{display:flex;align-items:center;justify-content:center;gap:18px;margin:12px 0}
.step button{width:48px;height:48px;border-radius:50%;background:var(--card);box-shadow:var(--sh);font-size:24px}
.step b{font-size:28px;min-width:90px;text-align:center}
/* stats */
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;background:var(--card);padding:12px;border-radius:20px;box-shadow:var(--sh)}
.bars div{flex:1;border-radius:6px 6px 3px 3px;background:var(--ac);min-height:3px}

.heat i{aspect-ratio:1;border-radius:3px;background:var(--card2)}

.rk em{font-style:normal;font-weight:700;font-size:15px}

.login{max-width:340px;margin:18vh auto 0;text-align:center}.login .logo{width:84px;height:84px;border-radius:26px;margin:0 auto 14px;display:block}

<script>

async function api(m,u,b){
  const r=await fetch(u,{method:m,headers:b?{"Content-Type":"application/json"}:{},body:b?JSON.stringify(b):undefined});
  if(r.status===401){S={edit:false};render();throw new Error("401")}
  if(!r.ok){let e="";try{e=(await r.json()).detail}catch(_){}throw new Error(e||r.status)}
  return r.json();
}
async function load(){
  S=await api("GET","/api/state");
  if(!S.edit){render();return}
  sel=sel||S.today;
  logs={};for(const [h,d,c,s] of S.logs)logs[h+"|"+d]=[c,s];
  loaded=S.logs_from;

}
async function ensureLogs(day){   // older than the state's window: fetch that week
  if(day>=loaded)return;
  const a=mon(day),b=add(a,6);
  const r=await api("GET",`/api/logs?start=${a}&end=${b}`);
  for(const [h,d,c,s] of r.logs)logs[h+"|"+d]=[c,s];
  for(const h of S.habits)for(let i=0;i<7;i++)if(!logs[h.id+"|"+add(a,i)])logs[h.id+"|"+add(a,i)]=null;
}
const lg=(h,d)=>logs[h.id+"|"+d]||[0,false];
const sched=(h,d)=>{if(h.end_date&&d>h.end_date)return false;const r=h.repeat||"daily";
  if(r==="once")return d===h.created.slice(0,10);if(r==="weekly")return true;
  if(r==="monthly")return(h.mdays||"").split(",").includes(String(+d.slice(8)));return h.days.includes(String(wday(d)))};
const isDone=(h,d)=>{const l=lg(h,d);return !l[1]&&l[0]>=h.goal};
function visible(d){return S.habits.filter(h=>{const l=lg(h,d);return (sched(h,d)&&d>=h.created.slice(0,10))||l[0]>0||l[1]})}
function dayProg(d){const v=visible(d).filter(h=>!lg(h,d)[1]);return [v.filter(h=>isDone(h,d)).length,v.length]}

function ring(p,size,w,col,track){

  <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${c*Math.min(p,1)} ${c}" transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dasharray .4s"/></svg>`;
}
const IC={

 refresh:'<svg class="i" viewBox="0 0 24 24"><path d="M19.5 12a7.5 7.5 0 1 1-2.4-5.5M19.5 4.5v4.2h-4.2"/></svg>',

}
const SLOTH=`<svg viewBox="0 0 270 160" aria-hidden="true"><path d="M205 20c10-14 24-8 22 6 14-8 24 4 16 16-10 8-16 8-24 22-4 10-16 14-18-6-2-20-8-24 4-38z" fill="#3a3a3c"/><rect x="34" y="104" width="196" height="22" rx="10" fill="#444447"/><rect x="40" y="112" width="190" height="14" rx="7" fill="#3a3a3d"/>
<path d="M112 64c18-12 54-8 70 6 10 9 6 28-10 36-24 12-54 10-66-4-8-10-6-30 6-38z" fill="#b6aa9d"/><path d="M158 94c8 4 14 26 12 44-1 8 8 10 10 2 4-20-2-44-10-54z" fill="#a89c90"/><path d="M130 100c-6 6-10 24-14 36-2 8 8 10 11 2 5-16 6-30 3-38z" fill="#a89c90"/>
<path d="M170 134c-1 5 1 8 4 8s5-3 4-8M121 134c-1 5 1 8 4 8s5-3 4-8" stroke="#eee" stroke-width="3" fill="none" stroke-linecap="round"/>
<circle cx="92" cy="78" r="30" fill="#d3cabe"/><circle cx="68" cy="60" r="8" fill="#a89c90"/><ellipse cx="92" cy="80" rx="23" ry="17" fill="#b6a99c"/><ellipse cx="80" cy="76" rx="8" ry="6" fill="#4a403a" transform="rotate(-20 80 76)"/><ellipse cx="104" cy="76" rx="8" ry="6" fill="#4a403a" transform="rotate(20 104 76)"/>
<path d="M76 76q4 4 8 0M100 76q4 4 8 0" stroke="#d3cabe" stroke-width="2" fill="none" stroke-linecap="round"/><ellipse cx="92" cy="86" rx="4" ry="3" fill="#3a3330"/><path d="M86 92q6 4 12 0" stroke="#3a3330" stroke-width="2" fill="none" stroke-linecap="round"/></svg>`;
const EMPTYMSG=`${SLOTH}There's nothing due.<br>Time to create new habits!`;
function render(){
  const a=$("#app");
  if(!S){a.innerHTML="";return}
  if(!S.edit){
    a.innerHTML=`<div class="login"><img class="logo" src="/static/icons/icon-192.png" alt=""><h1 style="margin:0 0 4px">Habits</h1><p style="color:var(--dim);margin:0 0 18px">Sign in to continue</p>
    <input class="t" id="pw" type="password" placeholder="Password" autocomplete="current-password"><button class="btn pri" id="go">Sign in</button><div class="err" id="er"></div></div>`;
    const go=async()=>{try{await api("POST","/api/login",{password:$("#pw").value});await load()}catch(e){$("#er").textContent="Wrong password"}};
    $("#go").onclick=go;$("#pw").onkeydown=e=>{if(e.key==="Enter")go()};return;
  }
  document.body.className='t-'+tab;
  document.querySelector('main').className=tab==='today'?'today':'';
  const T=(t,ic,l)=>`<button class="tab ${tab===t?"on":""}" data-t="${t}">${ic}${l}</button>`;
  a.innerHTML=(tab==="today"?viewToday():tab==="habits"?viewHabits():viewStats())+`<nav><div>${T("today",IC.today,"Today")}${T("habits",IC.list,"Habits")}
    <button class="plus" id="new" aria-label="New habit">+</button>${T("stats",IC.stats,"Stats")}<button class="tab" data-cog>${IC.gear}Settings</button></div></nav>`;
  a.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();scrollTo(0,0)});
  $("#new").onclick=()=>pickPage();
  if(tab==="today")bindToday();
  if(tab==="habits")bindHabits();
  const st=$("#strip");if(st){st.scrollLeft=stripX==null?st.scrollWidth:stripX;st.onscroll=()=>{stripX=st.scrollLeft}}
  const sh=$(".ov");if(sh)sh.remove();
  if(sheet)sheet();
}
function topbar(title,left){return `<div class="top"><span class="lt">${left||""}</span><h1>${title}</h1><span class="rt"><button class="ib" id="rf" aria-label="Refresh">${IC.refresh}</button><button class="ib" data-cog aria-label="Settings">${IC.cog}</button></span></div>`}
const GROUPS=[["morning","Morning"],["afternoon","Afternoon"],["evening","Evening"],["anytime","Anytime"]];
function panelHtml(d){
  let h=`<div class="pf">`;
  for(const [k,l] of PF)h+=`<button class="${k===per?"on":""}" data-pf="${k}">${l}</button>`;
  h+=`</div>`;
  const vis=visible(d).filter(x=>per==="all"||x.period===per||x.period==="anytime");
  if(!vis.length)h+=`<div class="empty">${EMPTYMSG}</div>`;
  for(const [k,l] of GROUPS){
    const hs=vis.filter(x=>x.period===k);if(!hs.length)continue;
    h+=`<div class="grp">${l}</div>`;for(const x of hs)h+=card(x,d);
  }
  return h;
}
function viewToday(){
  const d=sel,from=add(S.today,-120);
  const title=d===S.today?"Today":d===add(S.today,-1)?"Yesterday":dt(d).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"});
  let h=`<div class="sky">`+topbar(title,`<button class="ib" data-t="habits" aria-label="Habits">${IC.list}</button>`)+`<div class="strip" id="strip">`;
  for(let i=0;i<=121;i++){const x=add(from,i);h+=`<button class="dy ${x===d?"sel":""} ${x===S.today?"td":""} ${x>S.today?"fut":""}" data-d="${x}"><span>${WD[wday(x)].slice(0,2)}</span><b>${+x.slice(8)}</b></button>`}
  return h+`</div>${scene(per)}</div><div class="panel">${panelHtml(d)}</div>`;
}
// switching a day part updates the scene attribute in place (so the sun/moon animate) and only redraws the panel
function setPer(k){
  if(k===per)return;
  per=k;
  const sc=document.querySelector(".scene"),pn=document.querySelector(".panel");
  if(!sc||!pn){render();return}
  sc.dataset.p=k;pn.innerHTML=panelHtml(sel);
  pn.classList.remove("fx");void pn.offsetWidth;pn.classList.add("fx");
  bindPanel();
}
const STOP='<svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="16" cy="18.5" r="10"/><path d="M16 12.5v6.5l3.5 2.2M12.5 3.5h7M16 3.5v5M25 8.5l2.2 2.2"/></svg>';
const TKEY="hbTimer";
const tget=()=>{try{return JSON.parse(localStorage.getItem(TKEY))}catch(e){return null}};
const tset=t=>t?localStorage.setItem(TKEY,JSON.stringify(t)):localStorage.removeItem(TKEY);
const telapsed=t=>t?(t.acc+(t.run?Date.now()-t.start:0))/1000:0;
const mmss=x=>{x=Math.floor(x);return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0")};
function tinfo(t){
  const el=telapsed(t);let acc=0,focus=0;
  for(let i=0;i<t.iv.length;i++){const len=t.iv[i].m*60;
    if(el<acc+len){if(t.iv[i].t==="f")focus+=el-acc;return{i,rem:acc+len-el,type:t.iv[i].t,focus,fin:false}}
    if(t.iv[i].t==="f")focus+=len;acc+=len}
  return{i:t.iv.length-1,rem:0,type:t.iv[t.iv.length-1].t,focus,fin:true}
}
const IVN={f:"Focus",s:"Short Break",l:"Long Break"};
const tdisp=t=>t.iv?mmss(tinfo(t).rem):mmss(telapsed(t));
const tlabel=t=>{const i=tinfo(t);return`${IVN[i.type]} · ${i.i+1}/${t.iv.length}`};
let tfin=false,tlast=null;
async function tautofinish(t){
  if(tfin)return;tfin=true;
  try{const h=S.habits.find(x=>x.id===t.id),mins=Math.round(tinfo(t).focus/60);tset(null);
    if(h&&mins>0){await api("POST","/api/log",{habit_id:t.id,day:t.day,count:lg(h,t.day)[0]+mins});if(navigator.vibrate)navigator.vibrate([250,120,250])}
    await refresh()}finally{tfin=false}
}
setInterval(()=>{const t=tget();if(!t)return;
  document.querySelectorAll(`[data-tt="${t.id}"]`).forEach(e=>{e.textContent=tdisp(t)});
  if(t.iv&&t.run){const i=tinfo(t);
    document.querySelectorAll(`[data-ts="${t.id}"]`).forEach(e=>{e.textContent=tlabel(t)});
    if(i.fin){tautofinish(t);return}
    if(tlast!==null&&tlast!==i.i&&navigator.vibrate)navigator.vibrate(200);tlast=i.i}},1000);
function card(h,d){
  const l=lg(h,d),dn=isDone(h,d),sk=l[1];
  const wd=h.repeat==="weekly"?[0,1,2,3,4,5,6].filter(i=>isDone(h,add(mon(S.today),i))).length:0;
  const sub=sk?"Skipped":h.repeat==="weekly"?`${wd}/${h.wk} this week`:h.total===0?"New":`${h.streak} day${h.streak===1?"":"s"}`;
  let right;
  if(h.kind==="timer"){
    const t=tget(),mine=!!t&&t.id===h.id;
    const lab=sk?"skipped":mine?`<span class="run" data-tt="${h.id}">${tdisp(t)}</span>`:dn?`<span style="color:#2ecc71">${l[0]}m</span>`:l[0]?`${l[0]}/${h.goal}m`:`${h.goal}m`;
    right=`<button class="tmr" data-ck="${h.id}" aria-label="Timer"><span style="color:${dn?"#2ecc71":h.color};display:flex">${STOP}</span><small>${lab}</small></button>`;
  }else{
    const cnt=sk?`<b style="color:var(--dim)">–</b><small>skipped</small>`
      :`<b style="color:${dn?"#30d158":h.color}">${l[0]}</b><i style="color:${dn?"#30d15888":hex(h.color,.5)}">/${h.goal}</i><small>${esc(h.unit||"times")}</small>`;
    right=`<button class="cnt" data-ck="${h.id}" aria-label="Add one">${cnt}</button>`;
  }
  return `<div class="hw" data-id="${h.id}"><div class="rv l"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>Done</div><div class="rv r">Undo<svg viewBox="0 0 24 24"><path d="M4 9h11a5 5 0 010 10h-3M4 9l4-4M4 9l4 4"/></svg></div><div class="h ${dn?"done":""} ${sk?"skip":""}"><button class="tx" data-open="${h.id}"><span class="em">${ico(h)}</span>
  <span class="nm"><b>${esc(h.name)}</b><small><i style="color:${h.color}">★</i>${sub}</small></span></button>${right}</div></div>`;
}
function bindToday(){
  document.querySelectorAll(".dy").forEach(b=>b.onclick=()=>{if(b.dataset.d<=S.today)go(b.dataset.d)});
  bindPanel();
}
function bindPanel(){
  document.querySelectorAll("[data-pf]").forEach(b=>b.onclick=()=>setPer(b.dataset.pf));
  document.querySelectorAll("[data-ck]").forEach(b=>b.onclick=()=>tap(+b.dataset.ck));
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openDetail(+b.dataset.open));
  document.querySelectorAll(".hw").forEach(bindSwipe);
}
// swipe right = finish (full goal), swipe left = unfinish (0, also clears a skip); a drag never counts as a tap
let swiped=0;
function bindSwipe(w){
  const row=w.querySelector(".h"),id=+w.dataset.id,TH=90;
  let x0=0,y0=0,dx=0,mode=0,pid=null;      // mode 0 = undecided, 1 = swiping, -1 = scrolling
  row.addEventListener("pointerdown",e=>{if(e.button>0)return;x0=e.clientX;y0=e.clientY;dx=0;mode=0;pid=e.pointerId;row.classList.remove("snap")});
  row.addEventListener("pointermove",e=>{
    if(e.pointerId!==pid)return;
    const ax=e.clientX-x0,ay=e.clientY-y0;
    if(mode===0){if(Math.abs(ax)>10&&Math.abs(ax)>Math.abs(ay)*1.5){mode=1;try{row.setPointerCapture(pid)}catch(_){}}else if(Math.abs(ay)>10){mode=-1}}
    if(mode!==1)return;
    dx=Math.max(-160,Math.min(160,ax));
    row.style.transform=`translateX(${dx}px)`;
    w.classList.toggle("sr",dx>0);w.classList.toggle("sl",dx<0);
  });
  const end=async e=>{
    if(e.pointerId!==pid)return;pid=null;
    if(mode!==1)return;
    swiped=Date.now();
    row.classList.add("snap");row.style.transform="";w.classList.remove("sr","sl");
    const h=S.habits.find(x=>x.id===id),l=lg(h,sel);
    if(dx>=TH&&!(isDone(h,sel)))await swipeSet(id,h.goal);
    else if(dx<=-TH&&(l[0]>0||l[1]))await swipeSet(id,0);
  };
  row.addEventListener("pointerup",end);row.addEventListener("pointercancel",end);
  row.addEventListener("click",e=>{if(Date.now()-swiped<350){e.stopPropagation();e.preventDefault()}},true);
}
const daysText=x=>{const r=x.repeat||"daily";if(r==="once")return"Once";if(r==="weekly")return`${x.wk||1}× per week`;if(r==="monthly")return"Monthly on "+(x.mdays||"").split(",").join(", ");return x.days==="0123456"?"Every day":x.days.split("").map(i=>WD[i]).join(", ")};
function viewHabits(){
  let h=topbar("Habits");
  if(!S.habits.length)return h+`<div class="empty">${EMPTYMSG}</div>`;
  S.habits.forEach((x,i)=>{
    h+=`<div class="h mg"><button class="tx" data-edit="${x.id}"><span class="em">${ico(x)}</span><span class="nm"><b>${esc(x.name)}</b><small>${daysText(x)} · ${PER[x.period][0]}${x.kind==="timer"?` · ${x.goal} min`:x.goal>1?` · ${x.goal} ${esc(x.unit||"times")}`:""}</small></span></button>
    <div class="mv"><button data-mv="${x.id}" data-dir="-1" ${i?"":"disabled"} aria-label="Move up">▲</button><button data-mv="${x.id}" data-dir="1" ${i<S.habits.length-1?"":"disabled"} aria-label="Move down">▼</button></div></div>`;
  });
  return h;
}
function bindHabits(){
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openEdit(S.habits.find(x=>x.id===+b.dataset.edit)));
  document.querySelectorAll("[data-mv]").forEach(b=>b.onclick=async()=>{
    const ids=S.habits.map(x=>x.id),i=ids.indexOf(+b.dataset.mv),j=i+ +b.dataset.dir;if(j<0||j>=ids.length)return;
    [ids[i],ids[j]]=[ids[j],ids[i]];await api("POST","/api/habits/order",{ids});await refresh();
  });
}
async function go(d){await ensureLogs(d);sel=d;render()}
function confetti(el,col){
  const r=el.getBoundingClientRect();
  for(let i=0;i<16;i++){
    const s=document.createElement("span");s.className="cf";
    const a=Math.random()*6.28,k=30+Math.random()*40;
    s.style.cssText=`position:fixed;left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;background:${i%3?col:COLORS[i%COLORS.length]};--x:${Math.cos(a)*k}px;--y:${Math.sin(a)*k}px`;
    document.body.appendChild(s);setTimeout(()=>s.remove(),750);
  }
}
async function setCount(h,d,n,opts){
  const c=Math.max(0,n),was=isDone(h,d);
  logs[h.id+"|"+d]=c||opts?.skipped?[c,!!opts?.skipped]:null;
  const body={habit_id:h.id,day:d,count:c};if(opts?.skipped!==undefined)body.skipped=opts.skipped;
  const p=api("POST","/api/log",body);
  return {p,became:!was&&isDone(h,d)};
}
async function swipeSet(id,n){
  const h=S.habits.find(x=>x.id===id),d=sel;
  const {p,became}=await setCount(h,d,n);
  render();
  if(became){const b=document.querySelector(`[data-ck="${id}"]`);if(b){b.classList.add("pop");confetti(b,h.color)}}
  if(navigator.vibrate)navigator.vibrate(became?25:8);
  try{await p}catch(e){}
  const keep=sel;await refresh();sel=keep;
}
async function tap(id){
  const h=S.habits.find(x=>x.id===id),d=sel,l=lg(h,d);
  if(h.kind==="timer"){openTimer(id);return}
  await swipeSet(id,h.goal===1?(isDone(h,d)?0:1):(l[0]>=h.goal&&!l[1]?0:l[0]+1));
}
async function refresh(){   // reload the server numbers (streaks, summary) without losing the page state
  const t=document.scrollingElement.scrollTop,s=sheet;const keepLogs={...logs};
  const st=await api("GET","/api/state");S=st;logs={...keepLogs};
  for(const [h,d,c,sk] of S.logs)logs[h+"|"+d]=[c,sk];
  sheet=s;render();document.scrollingElement.scrollTop=t;
}

let dId=null,dMonth=null,dLogs={};
async function openDetail(id){
  dId=id;dMonth=sel.slice(0,7);dLogs={};
  const h=S.habits.find(x=>x.id===id);
  const r=await api("GET",`/api/logs?start=${add(S.today,-399)}&end=${S.today}&habit_id=${id}`);
  for(const [,d,c,s] of r.logs)dLogs[d]=[c,s];
  sheet=detailSheet;render();
}
function detailSheet(){
  const h=S.habits.find(x=>x.id===dId);if(!h){sheet=null;return}
  const ov=document.createElement("div");ov.className="ov";
  const [y,m]=dMonth.split("-").map(Number),first=`${dMonth}-01`,off=wday(first),dim=new Date(Date.UTC(y,m,0)).getUTCDate();
  const nm=dt(first).toLocaleDateString("en-GB",{month:"long",year:"numeric",timeZone:"UTC"});
  let cal=WD.map(w=>`<div class="hd">${w[0]}</div>`).join("")+"<i></i>".repeat(off);
  for(let i=1;i<=dim;i++){
    const d=`${dMonth}-${String(i).padStart(2,"0")}`,l=dLogs[d]||[0,false],fu=d>S.today,ok=!l[1]&&l[0]>=h.goal;
    const cls=fu?"fu":ok?"ok":l[1]?"sk":h.repeat!=="weekly"&&sched(h,d)&&d>=h.created.slice(0,10)&&d<S.today?"miss":!sched(h,d)?"off":"";
    cal+=`<div class="c ${cls} ${d===S.today?"td":""}" data-day="${fu?"":d}" ${ok?`style="background:${h.color}"`:""}>${i}</div>`;
  }
  const d=sel,l=lg(h,d),multi=h.goal>1||h.kind==="timer",st=h.kind==="timer"?5:1;
  ov.innerHTML=`<div class="sheet"><h2><span style="font-size:30px">${ico(h)}</span>${esc(h.name)}<button class="x" id="cl">✕</button></h2>
  <div class="tiles"><div class="tile"><b>🔥 ${h.streak}</b><span>Current streak</span></div><div class="tile"><b>🏆 ${h.best}</b><span>Best streak</span></div>
  <div class="tile"><b>${h.total}</b><span>Times completed</span></div><div class="tile"><b>${h.rate==null?"–":h.rate+"%"}</b><span>Completion rate</span></div></div>
  ${multi?`<div class="step"><button id="mn">−</button><b>${l[0]} / ${h.goal}<br><small style="font-size:12px;color:var(--dim);font-weight:600">${esc(h.unit)}</small></b><button id="pl">+</button></div>`:""}
  <div class="mh"><button id="pm">‹</button>${nm}<button id="nm_">›</button></div><div class="cal">${cal}</div>
  <p style="color:var(--dim);font-size:12px;margin:8px 4px">Tap a day to toggle it. ${multi?"Taps on the calendar complete the whole goal.":""}</p>
  <button class="btn" id="skp">${l[1]?"Undo skip":"Skip "+(d===S.today?"today":"this day")+" (keeps streak)"}</button>
  <button class="btn" id="ed">✏️ Edit habit</button></div>`;
  document.body.appendChild(ov);
  const close=()=>{sheet=null;ov.remove()};
  ov.onclick=e=>{if(e.target===ov)close()};$("#cl").onclick=close;
  $("#pm").onclick=()=>{dMonth=add(`${dMonth}-01`,-1).slice(0,7);ov.remove();detailSheet()};
  $("#nm_").onclick=()=>{const n=add(`${dMonth}-28`,5).slice(0,7);if(n<=S.today.slice(0,7)){dMonth=n;ov.remove();detailSheet()}};
  ov.querySelectorAll("[data-day]").forEach(c=>c.onclick=async()=>{
    const day=c.dataset.day;if(!day)return;
    const ok=!(dLogs[day]||[0,false])[1]&&(dLogs[day]||[0])[0]>=h.goal,n=ok?0:h.goal;
    dLogs[day]=n?[n,false]:[0,false];logs[h.id+"|"+day]=n?[n,false]:null;
    await api("POST","/api/log",{habit_id:h.id,day,count:n});await refresh();
  });
  if(multi){$("#mn").onclick=()=>step(h,d,l[0]-st);$("#pl").onclick=()=>step(h,d,l[0]+st)}
  $("#skp").onclick=async()=>{await api("POST","/api/log",{habit_id:h.id,day:d,skipped:!l[1]});dLogs[d]=null;delete logs[h.id+"|"+d];
    const r=await api("GET",`/api/logs?start=${d}&end=${d}&habit_id=${h.id}`);for(const [,dd,c,s] of r.logs){dLogs[dd]=[c,s];logs[h.id+"|"+dd]=[c,s]}await refresh()};
  $("#ed").onclick=()=>{close();openEdit(h)};
}
async function step(h,d,n){
  n=Math.max(0,Math.min(n,h.goal*3));dLogs[d]=n?[n,false]:null;logs[h.id+"|"+d]=n?[n,false]:null;
  await api("POST","/api/log",{habit_id:h.id,day:d,count:n});await refresh();
}

const X='<svg class="i" viewBox="0 0 24 24"><path d="M5.5 5.5l13 13M18.5 5.5l-13 13"/></svg>',BACK='<svg class="i" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>';

function openPage(el){document.body.appendChild(el);document.documentElement.style.overflow="hidden"}
function closePage(all){
  const ps=document.querySelectorAll(".pg");
  if(all)ps.forEach(p=>p.remove());else if(ps.length)ps[ps.length-1].remove();
  if(!document.querySelector(".pg"))document.documentElement.style.overflow="";
}
function tplRows(list){return list.map((t,i)=>`<button class="tr" data-i="${i}"><span class="em">${ico(t)}</span><span><b>${esc(t.name)}</b><small>${esc(t.sub)}</small></span></button>`).join("")}
function bindRows(root,list){root.querySelectorAll(".tr").forEach(b=>b.onclick=()=>editPage(null,list[+b.dataset.i],true))}
function pickPage(){
  const el=document.createElement("div");el.className="pg";
  el.innerHTML=`<div class="pgbar"><button class="pb" aria-label="Close">${X}</button><b>Pick a New One</b><span></span></div>
  <div class="pgbody pickbody"><label class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input id="q" placeholder="Search" autocomplete="off"></label><div id="res"></div></div>
  <div class="cta"><button class="yel" id="own">Create Your Own</button></div>`;
  el.querySelector(".pb").onclick=()=>closePage();
  const res=el.querySelector("#res"),q=el.querySelector("#q");
  const cats=()=>{res.innerHTML=TPL.map((c,i)=>`<button class="cat" data-c="${i}"><b>${c.name}</b><span>${c.sub}</span><i class="art">${ARTS[c.art]}</i></button>`).join("");
    res.querySelectorAll(".cat").forEach(b=>b.onclick=()=>catPage(TPL[+b.dataset.c]))};
  q.oninput=()=>{
    const v=q.value.trim().toLowerCase();if(!v){cats();return}
    const seen=new Set(),hits=[];
    for(const c of TPL)for(const t of c.items)if(!seen.has(t.name)&&(t.name.toLowerCase().includes(v)||t.sub.toLowerCase().includes(v))){seen.add(t.name);hits.push(t)}
    res.innerHTML=hits.length?tplRows(hits):`<div class="empty2">Nothing found. Tap “Create Your Own”.</div>`;bindRows(res,hits);
  };
  cats();
  el.querySelector("#own").onclick=()=>editPage(null,null,true);
  openPage(el);
}
function catPage(c){
  const el=document.createElement("div");el.className="pg";
  el.innerHTML=`<div class="cathead"><button class="pb" aria-label="Back">${BACK}</button><h1>${c.name}</h1><i class="art">${ARTS[c.art]}</i></div><div class="pgbody" style="padding:0"><div class="cnt2">${c.items.length} habits</div>${tplRows(c.items)}</div>`;
  el.querySelector(".pb").onclick=()=>closePage();bindRows(el,c.items);openPage(el);
}

function wheel(cols,done){
  const ov=document.createElement("div");ov.className="ov wh";
  ov.innerHTML=`<div class="whs" role="dialog"><div class="whb"><button id="wc">Cancel</button><button id="wk">Save</button></div><div class="whw"><div class="whband"></div>${cols.map((c,i)=>c.fixed?`<div class="wfix">${esc(c.fixed)}</div>`:`<div class="wcol" data-i="${i}">${c.items.map(x=>`<div>${esc(String(x))}</div>`).join("")}</div>`).join("")}</div></div>`;
  document.body.appendChild(ov);
  const cs=[...ov.querySelectorAll(".wcol")];cs.forEach(e=>{e.scrollTop=cols[+e.dataset.i].sel*44});
  ov.onclick=e=>{if(e.target===ov)ov.remove()};ov.querySelector("#wc").onclick=()=>ov.remove();
  ov.querySelector("#wk").onclick=()=>{done(cs.map(e=>Math.max(0,Math.min(cols[+e.dataset.i].items.length-1,Math.round(e.scrollTop/44)))));ov.remove()};

  const t=tpl||{};
  const f=h?{...h,description:h.description||"",goalOn:true}
    :{name:t.name||"",description:"",emoji:t.emoji||"ic:check",color:t.color||"#1e90ff",period:t.period||"anytime",days:"0123456",goal:t.goal||1,unit:t.unit||"",kind:t.kind||"units",end_date:null,goalOn:true};
  f.repOn=!h||h.repeat!=="once";f.mode=h&&h.repeat&&h.repeat!=="once"?h.repeat:"daily";f.wk=f.wk||1;f.mdays=f.mdays||"";
  f.iv=h&&h.intervals&&h.intervals.length?h.intervals.map(x=>({...x})):(f.kind==="timer"?(/pomodoro/i.test(f.name)?POM():[{m:f.goal>=1?f.goal:25,t:"f"}]):[]);
  const ui={pick:null,rep:true,tod:false,end:!!f.end_date};
  const el=document.createElement("div");el.className="pg";
  el.innerHTML=`<div class="pgbar"><button class="pb" id="bk" aria-label="Back">${fromPicker?BACK:X}</button><b>Habit</b><button class="save" id="sv">Save</button></div><div class="pgbody" id="pb"></div>`;
  const body=el.querySelector("#pb");
  const sync=()=>{const g=i=>body.querySelector(i);
    if(g("#nm"))f.name=g("#nm").value;if(g("#ds"))f.description=g("#ds").value;if(g("#ed"))f.end_date=g("#ed").value||null};
  const view=()=>({repeat:f.repOn?f.mode:"once",wk:f.wk,mdays:f.mdays,days:f.days});
  const draw=()=>{
    const keep=el.scrollTop,tod=f.period==="anytime"?"Any time of the day":PER[f.period][0];
    el.style.setProperty("--ac",f.color);el.style.setProperty("--acf",lum(f.color)>.6?"#1c1c1e":"#fff");
    const md=new Set(f.mdays.split(",").filter(Boolean).map(Number));
    const repBody=f.mode==="daily"?`<div class="exp"><div style="flex:1 1 100%;display:flex;gap:6px;justify-content:space-between">${WD.map((w,i)=>`<button class="wd2 ${f.days.includes(i)?"on":""}" data-w="${i}">${w.slice(0,1)}</button>`).join("")}</div></div>`
      :f.mode==="weekly"?`<div class="exp"><span style="flex:1 1 100%;color:#b0b0b5;font-weight:300">Times per week</span><div style="flex:1 1 100%;display:flex;gap:6px;justify-content:space-between">${[1,2,3,4,5,6,7].map(n=>`<button class="wd2 ${f.wk===n?"on":""}" data-wk="${n}">${n}</button>`).join("")}</div></div>`
      :`<div class="exp"><div class="mgrid">${Array.from({length:31},(_,i)=>`<button class="wd2 ${md.has(i+1)?"on":""}" data-md="${i+1}">${i+1}</button>`).join("")}</div></div>`;
    const ivHtml=`<div class="ivs">${f.iv.map((x,i)=>`<div class="ivl"><button class="ivm" data-ivm="${i}">${x.m}m</button><button class="ivt" data-ivt="${i}">${IVL[x.t]}</button>${f.iv.length>1?`<button class="ivx" data-ivx="${i}" aria-label="Remove">${X}</button>`:""}</div>`).join("")}${f.iv.length<12?`<button class="ivadd" data-ivadd="1">Add time interval</button>`:""}</div>`;
    body.innerHTML=`<div class="cd"><input class="fi" id="nm" placeholder="Name" maxlength="60" value="${esc(f.name)}"><div class="hl"></div><textarea class="fi" id="ds" rows="2" maxlength="500" placeholder="Description">${esc(f.description)}</textarea></div>
    <div class="tl2"><button class="tl" data-pick="emoji" aria-label="Icon"><span>${ico(f)}</span></button><button class="tl" data-pick="color" aria-label="Colour"><i style="background:${f.color}"></i></button></div>
    ${ui.pick==="emoji"?`<div class="cd pad"><div class="emg">${Object.keys(HI).map(k=>`<button data-e="ic:${k}" class="${"ic:"+k===f.emoji?"on":""}">${ico({emoji:"ic:"+k,color:f.color})}</button>`).join("")}</div></div>`:""}
    ${ui.pick==="color"?`<div class="cd pad"><div class="row">${COLORS.map(c=>`<button class="sw ${c===f.color?"on":""}" data-c="${c}" style="background:${c}" aria-label="${c}"></button>`).join("")}</div></div>`:""}
    <div class="cd"><div class="rw"><span>Repeat</span><button class="tg ${f.repOn?"on":""}" data-tg="rep" role="switch" aria-checked="${f.repOn}" aria-label="Repeat"></button></div>
      ${f.repOn?`<div class="hl"></div><button class="rw" data-tgl="rep"><span>${daysText(view())}</span>${ui.rep?CU:CH}</button>
      ${ui.rep?`<div class="seg">${["daily","weekly","monthly"].map(m=>`<button class="${f.mode===m?"on":""}" data-mode="${m}">${m[0].toUpperCase()+m.slice(1)}</button>`).join("")}</div>${repBody}`:""}`:""}
      <div class="hl"></div><div class="rw"><span>Set end date</span><button class="tg ${ui.end?"on":""}" data-tg="end" role="switch" aria-checked="${ui.end}" aria-label="Set end date"></button></div>
      ${ui.end?`<div class="hl"></div><div class="rw"><span>End</span><input class="dt" type="date" id="ed" min="${S.today}" value="${f.end_date||""}"></div>`:""}</div>
    <div class="cd"><div class="rw"><span>Goal</span><button class="tg ${f.goalOn?"on":""}" data-tg="goal" role="switch" aria-checked="${f.goalOn}" aria-label="Goal"></button></div>
      ${f.goalOn?`<div class="hl"></div><div class="seg"><button class="${f.kind==="units"?"on":""}" data-kind="units">Units</button><button class="${f.kind==="timer"?"on":""}" data-kind="timer">Timer</button></div>
      ${f.kind==="timer"?ivHtml:`<button class="gl" data-gl="1"><span>${esc(goalText(f))}</span>${CHR}</button>`}`:""}</div>
    <div class="cd"><button class="rw" data-tgl="tod"><span>${tod}</span>${CH}</button>
      ${ui.tod?`<div class="hl"></div><div class="exp"><div style="flex:1 1 100%;display:flex;gap:8px">${["morning","afternoon","evening"].map(k=>`<button class="chip2 ${f.period===k?"on":""}" style="flex:1;padding:13px 4px" data-p="${k}">${PER[k][0]}</button>`).join("")}</div><button class="chip2 wide ${f.period==="anytime"?"on":""}" data-p="anytime">Any time of the day</button></div>`:""}</div>
    <div class="err" id="er"></div>${h?`<button class="del" id="del">Delete habit</button>`:""}`;
    el.scrollTop=keep;
  };
  body.onclick=e=>{
    const b=e.target.closest("button");if(!b)return;sync();const d=b.dataset;
    if(d.pick){ui.pick=ui.pick===d.pick?null:d.pick;draw()}
    else if(d.e){f.emoji=d.e;ui.pick=null;draw()}
    else if(d.c){f.color=d.c;ui.pick=null;draw()}
    else if(d.tgl){ui[d.tgl]=!ui[d.tgl];draw()}
    else if(d.tg==="rep"){f.repOn=!f.repOn;draw()}
    else if(d.tg==="end"){ui.end=!ui.end;if(!ui.end)f.end_date=null;draw()}
    else if(d.tg==="goal"){f.goalOn=!f.goalOn;draw()}
    else if(d.kind){if(f.kind!==d.kind){f.kind=d.kind;if(f.kind==="timer"&&!f.iv.length)f.iv=/pomodoro/i.test(f.name)?POM():[{m:f.goal>=5?f.goal:25,t:"f"}];if(f.kind==="units"&&f.goal>99)f.goal=1}draw()}
    else if(d.gl){
      const ul=UNITS.includes(f.unit||"times")?UNITS:[f.unit,...UNITS];
      wheel([{items:Array.from({length:999},(_,i)=>i+1),sel:Math.max(0,Math.min(998,f.goal-1))},{items:ul,sel:Math.max(0,ul.indexOf(f.unit||"times"))},{fixed:"per day"}],([g,u])=>{
        f.goal=g+1;let n=ul[u];if(n==="custom…"){n=(prompt("Unit name (e.g. laps)",f.unit&&f.unit!=="times"?f.unit:"")||"").trim().slice(0,20);if(!n)n=f.unit}f.unit=n==="times"?"":n;draw()});
    }
    else if(d.ivm!==undefined){const i=+d.ivm;wheel([{items:Array.from({length:240},(_,k)=>k+1),sel:f.iv[i].m-1},{fixed:"minutes"}],([m])=>{f.iv[i].m=m+1;draw()})}
    else if(d.ivt!==undefined){const i=+d.ivt,o=["f","s","l"];f.iv[i].t=o[(o.indexOf(f.iv[i].t)+1)%3];draw()}
    else if(d.ivx!==undefined){f.iv.splice(+d.ivx,1);draw()}
    else if(d.ivadd){const last=f.iv[f.iv.length-1];f.iv.push(last&&last.t==="f"?{m:5,t:"s"}:{m:25,t:"f"});draw()}
    else if(d.p){f.period=d.p;draw()}
    else if(d.mode){f.mode=d.mode;draw()}
    else if(d.wk){f.wk=+d.wk;draw()}
    else if(d.md){const s=new Set(f.mdays.split(",").filter(Boolean).map(Number));s.has(+d.md)?s.delete(+d.md):s.add(+d.md);f.mdays=[...s].sort((a,b)=>a-b).join(",");draw()}
    else if(d.w!==undefined){const i=d.w;f.days=f.days.includes(i)?f.days.replace(i,""):(f.days+i).split("").sort().join("");draw()}
    else if(b.id==="del"&&confirm(`Delete "${h.name}" and all its history?`)){api("DELETE","/api/habit/"+h.id).then(()=>{closePage(true);return refresh()})}
  };
  body.oninput=e=>{if(e.target.id==="em"){const v=e.target.value.trim();if(v){const seg=window.Intl&&Intl.Segmenter?[...new Intl.Segmenter().segment(v)].map(x=>x.segment):Array.from(v);f.emoji=seg[0]}}};
  body.onchange=e=>{if(e.target.id==="em"){sync();ui.pick=null;draw()}};
  el.querySelector("#bk").onclick=()=>closePage();
  el.querySelector("#sv").onclick=async()=>{
    sync();const er=m=>{body.querySelector("#er").textContent=m};
    if(!f.name.trim())return er("Give your habit a name");
    if(f.repOn&&f.mode==="daily"&&!f.days)return er("Pick at least one day to repeat on");
    if(f.repOn&&f.mode==="monthly"&&!f.mdays)return er("Pick at least one date");
    if(ui.end&&!f.end_date)return er("Pick an end date, or switch it off");
    const kind=f.goalOn?f.kind:"units";
    if(kind==="timer"&&!f.iv.some(x=>x.t==="f"))return er("Add at least one focus interval");
    const goal=kind==="timer"?Math.min(1440,ivGoal(f.iv)):(f.goalOn?f.goal:1);
    try{await api("POST",h?"/api/habit/"+h.id:"/api/habit",{name:f.name,description:f.description,emoji:f.emoji,color:f.color,period:f.period,days:f.days||"0123456",goal,
      unit:kind==="timer"?"min":(f.goalOn?f.unit:""),kind,end_date:ui.end?f.end_date:null,repeat:f.repOn?f.mode:"once",wk:f.wk,mdays:f.mdays,intervals:kind==="timer"?f.iv:[]});closePage(true);await refresh()}
    catch(e){er(e.message)}
  };
  draw();openPage(el);
}
/* ---------- timer habits ---------- */
let tId=null;
function openTimer(id){tId=id;sheet=timerSheet;render()}
function timerSheet(){
  const h=S.habits.find(x=>x.id===tId);if(!h){sheet=null;return}
  const t=tget(),mine=!!t&&t.id===h.id,other=!!t&&t.id!==h.id,done=lg(h,S.today)[0],hiv=!!(h.intervals&&h.intervals.length),oh=other?S.habits.find(x=>x.id===t.id):null;
  const ov=document.createElement("div");ov.className="ov";
  ov.innerHTML=`<div class="sheet"><h2><span style="font-size:30px">${ico(h)}</span>${esc(h.name)}<button class="x" id="cl">✕</button></h2>
  <div class="tbig ${mine&&t.run?"go":""}" data-tt="${h.id}">${hiv?(mine?tdisp(t):mmss(h.intervals[0].m*60)):mmss(mine?telapsed(t):0)}</div>${hiv?`<div class="tsub" data-ts="${h.id}">${mine&&t.iv?tlabel(t):`Focus · 1/${h.intervals.length}`}</div>`:""}<div class="tsub">${done} / ${h.goal} min today</div>
  <div class="trow">${mine?(t.run?`<button class="btn" id="tp">Pause</button>`:`<button class="btn pri" id="ts">Resume</button>`):`<button class="btn pri" id="ts" ${other?"disabled":""}>Start</button>`}${mine?`<button class="btn" id="tx">Stop &amp; log</button>`:""}</div>
  ${other?`<p class="note">The timer for “${esc(oh?oh.name:"another habit")}” is still running. Stop it first.</p>`:""}
  <label class="l">Or add minutes by hand</label><div class="step"><button id="tm">−5</button><b>${done} min</b><button id="tpl">+5</button></div><div class="err" id="er"></div></div>`;
  document.body.appendChild(ov);
  const close=()=>{sheet=null;ov.remove()};ov.onclick=e=>{if(e.target===ov)close()};$("#cl").onclick=close;
  const adjust=async(n)=>{n=Math.max(0,n);logs[h.id+"|"+S.today]=n?[n,false]:null;await api("POST","/api/log",{habit_id:h.id,day:S.today,count:n});await refresh()};
  const st=$("#ts");if(st)st.onclick=()=>{if(other)return;if(!mine)tset({id:h.id,day:S.today,acc:0,start:Date.now(),run:true,iv:hiv?h.intervals:undefined});else{t.start=Date.now();t.run=true;tset(t)}render()};
  const tp=$("#tp");if(tp)tp.onclick=()=>{t.acc+=Date.now()-t.start;t.run=false;tset(t);render()};
  const tx=$("#tx");if(tx)tx.onclick=async()=>{
    const sec=t.iv?tinfo(t).focus:telapsed(t);let mins=Math.round(sec/60);if(sec>=30)mins=Math.max(1,mins);
    tset(null);
    if(mins>0){await adjust(lg(h,t.day)[0]+mins);return}
    render();const er=$("#er");if(er)er.textContent="Under 30 seconds: nothing logged";
  };
  $("#tm").onclick=()=>adjust(done-5);$("#tpl").onclick=()=>adjust(done+5);
}
function settingsSheet(){
  const ov=document.createElement("div");ov.className="ov";
  ov.innerHTML=`<div class="sheet"><h2>Settings<button class="x" id="cl">✕</button></h2>
  <label class="l">Change password</label><input class="t" id="cu" type="password" placeholder="Current password" autocomplete="current-password" style="margin-bottom:8px">
  <input class="t" id="nw" type="password" placeholder="New password (min 8 characters)" autocomplete="new-password"><div class="err" id="er"></div>
  <button class="btn" id="cp">Change password</button><button class="btn red" id="lo">Sign out</button></div>`;
  document.body.appendChild(ov);
  const close=()=>{sheet=null;ov.remove()};ov.onclick=e=>{if(e.target===ov)close()};$("#cl").onclick=close;
  $("#cp").onclick=async()=>{try{await api("POST","/api/password",{current:$("#cu").value,new:$("#nw").value});$("#er").style.color="#2ecc71";$("#er").textContent="Password changed"}catch(e){$("#er").style.color="";$("#er").textContent=e.message}};
  $("#lo").onclick=async()=>{await fetch("/api/logout",{method:"POST"});sheet=null;S={edit:false};render()};
}
/* ---------- stats ---------- */
function viewStats(){
  const days=S.days,map=Object.fromEntries(days.map(x=>[x[0],x]));
  const perfect=days.filter(x=>x[1]===x[2]).length;
  const last30=days.filter(x=>x[0]>add(S.today,-30)),avg=last30.length?Math.round(100*last30.reduce((a,x)=>a+x[1]/x[2],0)/last30.length):0;
  let ps=0;for(let i=0;i<400;i++){const x=map[add(S.today,-i)];if(!x)continue;if(x[1]===x[2])ps++;else if(i>0)break}
  const checks=days.reduce((a,x)=>a+x[1],0);
  let h=topbar("Stats")+`
  <div class="tiles"><div class="tile"><b>${avg}%</b><span>Avg. completion, 30 days</span></div><div class="tile"><b>🔥 ${ps}</b><span>Perfect-day streak</span></div>
  <div class="tile"><b>${perfect}</b><span>Perfect days</span></div><div class="tile"><b>${checks}</b><span>Total check-ins</span></div></div>`;
  const wk=mon(S.today);let bars="",lbl="";
  for(let i=11;i>=0;i--){
    const a=add(wk,-7*i),xs=[];for(let j=0;j<7;j++){const x=map[add(a,j)];if(x)xs.push(x[1]/x[2])}
    const v=xs.length?xs.reduce((p,q)=>p+q,0)/xs.length:0;
    bars+=`<div style="height:${Math.max(3,v*100)}%" title="${Math.round(v*100)}%"></div>`;lbl+=`<span>${+a.slice(8)}/${+a.slice(5,7)}</span>`;
  }
  h+=`<div class="sec">Weekly completion</div><div class="bars">${bars}</div><div class="bl">${lbl}</div>`;
  let cells="";const st=add(wk,-7*25);
  for(let i=0;i<26*7;i++){
    const d=add(st,i);if(d>S.today){cells+=`<i style="opacity:0"></i>`;continue}
    const x=map[d],p=x?x[1]/x[2]:-1;
    cells+=`<i title="${d}" style="${p<0?"":`background:${hex("#3b82f6",p===0?.12:.25+.75*p)}`}"></i>`;
  }
  h+=`<div class="sec">Last 26 weeks</div><div class="heat">${cells}</div><div class="sec">Habits</div>`;
  if(!S.habits.length)h+=`<div class="empty">No habits yet.</div>`;
  for(const x of [...S.habits].sort((a,b)=>(b.rate??-1)-(a.rate??-1)))
    h+=`<div class="rk"><div class="em" style="background:${hex(x.color,.18)}">${ico(x)}</div><div class="tx"><b>${esc(x.name)}</b><span style="font-size:12px;color:var(--dim)">🔥 ${x.streak} · best ${x.best} · ${x.total}×</span>
    <div class="pb"><i style="width:${x.rate||0}%;background:${x.color}"></i></div></div><em>${x.rate==null?"–":x.rate+"%"}</em></div>`;
  return h;
}
document.addEventListener("click",e=>{const t=e.target.closest&&e.target.closest("#rf");if(t){t.classList.add("spin");setTimeout(()=>location.reload(),250);return}
  if(e.target.closest&&e.target.closest("[data-cog]")){sheet=settingsSheet;render()}});
load().catch(()=>{});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S&&S.edit&&!sheet)refresh().catch(()=>{})});
</script></body></html>
