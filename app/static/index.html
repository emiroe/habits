<style>

let tId=null;
function openTimer(id){tId=id;sheet=timerSheet;render()}
function timerSheet(){

  const t=tget(),mine=!!t&&t.id===h.id,other=!!t&&t.id!==h.id,done=lg(h,S.today)[0],hiv=!!(h.intervals&&h.intervals.length),oh=other?S.habits.find(x=>x.id===t.id):null;
  const ov=document.createElement("div");ov.className="ov";
  ov.innerHTML=`<div class="sheet"><h2><span style="font-size:30px">${ico(h)}</span>${esc(h.name)}<button class="x" id="cl">✕</button></h2>
  <div class="tbig ${mine&&t.run?"go":""}" data-tt="${h.id}">${hiv?(mine?tdisp(t):mmss(h.intervals[0].m*60)):(mine?tdisp(t):mmss(Math.max(0,trem(h,null))))}</div>${hiv?`<div class="tsub" data-ts="${h.id}">${mine&&t.iv?tlabel(t):`Focus · 1/${h.intervals.length}`}</div>`:""}<div class="tsub">${done} / ${h.goal} min today</div>
  <div class="trow">${mine?(t.run?`<button class="btn" id="tp">Pause</button>`:`<button class="btn pri" id="ts">Resume</button>`):`<button class="btn pri" id="ts" ${other?"disabled":""}>Start</button>`}${mine?`<button class="btn" id="tx">Stop &amp; log</button>`:""}</div>
  ${other?`<p class="note">The timer for “${esc(oh?oh.name:"another habit")}” is still running. Stop it first.</p>`:""}
  <label class="l">Or add minutes by hand</label><div class="step"><button id="tm">−5</button><b>${done} min</b><button id="tpl">+5</button></div><div class="err" id="er"></div></div>`;
  document.body.appendChild(ov);
  const close=()=>{sheet=null;ov.remove()};ov.onclick=e=>{if(e.target===ov)close()};$("#cl").onclick=close;
  const adjust=async(n)=>{n=Math.max(0,n);logs[h.id+"|"+S.today]=n?[n,false]:null;await api("POST","/api/log",{habit_id:h.id,day:S.today,count:n});await refresh()};

document.addEventListener("pointermove",e=>{if(e.pointerType!=="touch"||e.buttons===0)return;const t=document.elementFromPoint(e.clientX,e.clientY),c=t&&t.closest&&t.closest("[data-tip]");if(c&&c!==tipEl)showTip(c)});
document.addEventListener("click",e=>{const t=e.target.closest&&e.target.closest("#rf");if(t){t.classList.add("spin");try{sessionStorage.setItem("hbNav",JSON.stringify({tab,per,sel}))}catch(e){}setTimeout(()=>location.reload(),250);return}
  if(e.target.closest&&e.target.closest("[data-cog]")){sheet=settingsSheet;render()}});
load().then(()=>flushQ()).catch(e=>{if(e&&e.message==="401")return;const a=document.getElementById("app");if(a&&!a.innerHTML.trim())a.innerHTML=`<div class="login"><h1 style="margin:0 0 8px">Habits</h1><p style="color:var(--dim)">${esc(e&&e.message||e)}</p><button class="btn" onclick="location.reload()">Try again</button></div>`});
const fixNav=()=>{const n=document.querySelector("nav");if(n){n.style.display="none";void n.offsetHeight;n.style.display=""}};   // iOS can leave the bottom bar mid-screen after a dialog or keyboard
document.addEventListener("focusout",()=>setTimeout(fixNav,300));
if(window.visualViewport)visualViewport.addEventListener("resize",()=>setTimeout(fixNav,100));
window.addEventListener("pageshow",fixNav);
document.addEventListener("visibilitychange",()=>{
  if(document.hidden){hiddenAt=Date.now();return}
  if(hiddenAt&&Date.now()-hiddenAt>20*60*1000&&per!=="all"&&per!==partNow()&&!document.querySelector(".pg")){per=partNow();if(S&&S.edit&&tab==="today")render()}   // back after a while: jump to the current part of the day
  if(S&&S.edit&&!sheet)refresh().catch(()=>{})});
</script></body></html>
