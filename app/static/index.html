<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1a1c"><title>Habits</title>
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="/static/icons/favicon.svg">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Habits"><meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
:root{color-scheme:dark;--bg:#1a1a1c;--nav:#202022;--card:#2a2a2c;--card2:#363639;--line:#3a3a3d;--txt:#f4f4f5;--dim:#8c8c92;--ac:#3b82f6;--ac2:#5b9bff;--sh:none}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--txt);font:16px/1.35 Lato,"Helvetica Neue",-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent;padding-bottom:calc(96px + env(safe-area-inset-bottom))}
main{max-width:520px;margin:0 auto;padding:calc(8px + env(safe-area-inset-top)) 16px 20px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.top{display:flex;align-items:center;margin-bottom:6px}
.top h1{flex:1;text-align:center;margin:0;font-size:17px;font-weight:600}
.ib{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%;color:var(--txt)}
.ib svg.i{width:22px;height:22px}
.sec{margin:18px 0 8px;font-size:13px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.07em}
/* date strip */
.strip{display:flex;overflow-x:auto;scrollbar-width:none;margin-bottom:2px}
.strip::-webkit-scrollbar{display:none}
.dy{flex:0 0 11.111%;display:flex;flex-direction:column;align-items:center;gap:7px;padding:9px 0 10px;border-radius:22px;color:var(--dim)}
.dy span{font-size:10px;font-weight:600;text-transform:uppercase}
.dy b{font-size:12px;font-weight:600}
.dy.sel{background:var(--card2);color:var(--txt)}.dy.sel b{font-weight:800}
.dy.fut{opacity:.35;pointer-events:none}
.scene{display:block;width:calc(100% + 32px);height:128px;margin:0 -16px}
/* period filter */
.pf{display:flex;justify-content:space-between;gap:4px;margin:6px 0 14px;overflow-x:auto;scrollbar-width:none}
.pf button{padding:8px 15px;border-radius:18px;color:var(--dim);font-size:14px;white-space:nowrap}
.pf button.on{background:var(--card);color:var(--txt)}
/* habit rows */
.h{display:flex;align-items:stretch;background:var(--card);border-radius:12px;margin-bottom:10px;position:relative;transition:opacity .2s}
.h .tx{flex:1;min-width:0;display:flex;align-items:center;gap:14px;padding:13px 8px 13px 16px;text-align:left}
.h .em{font-size:25px;width:30px;text-align:center;flex:none;line-height:1}
.h .nm{min-width:0}
.h .nm b{display:block;font-weight:400;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h .nm small{display:block;font-size:12px;color:var(--dim);margin-top:2px}
.h .nm small i{color:var(--ac);font-style:normal;margin-right:5px;font-size:9px;vertical-align:1px}
.h .cnt{flex:none;min-width:86px;padding:11px 16px 11px 8px;text-align:right}
.h .cnt b{font-size:17px;font-weight:700}.h .cnt i{font-style:normal;font-size:17px}
.h .cnt small{display:block;color:var(--dim);font-size:13px}
.h.done .nm b{color:var(--dim)}
.h.skip{opacity:.5}
.cnt:active{transform:scale(.94)}
.pop{animation:pop .35s}@keyframes pop{40%{transform:scale(1.25)}}
.cf{position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none;animation:cf .7s ease-out forwards;z-index:30}
@keyframes cf{to{transform:translate(var(--x),var(--y)) scale(.3);opacity:0}}
.empty{text-align:center;color:var(--dim);padding:40px 10px}.empty big{font-size:56px;display:block}
/* manage list */
.mg .sub{font-size:12px;color:var(--dim);margin-top:2px}
.mg .mv{display:flex;flex-direction:column;justify-content:center;padding:0 10px}
.mg .mv button{color:var(--dim);font-size:15px;padding:4px 8px}
/* tab bar */
nav{position:fixed;left:0;right:0;bottom:0;background:var(--nav);padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:20}
nav div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 80px 1fr 1fr;align-items:center}
nav .tab{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--dim);padding:2px 0}
nav .tab.on{color:var(--ac)}
nav .plus{justify-self:center;width:54px;height:54px;border-radius:50%;background:var(--ac);color:#fff;font-size:32px;line-height:1;margin-top:-34px;box-shadow:0 0 0 7px var(--nav)}
/* sheets */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:18px 18px calc(24px + env(safe-area-inset-bottom));animation:up .25s}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{margin:0 0 14px;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.sheet h2 .x{margin-left:auto;font-size:16px;width:34px;height:34px;border-radius:50%;background:var(--card2);color:var(--dim)}
label.l{display:block;font-size:12px;font-weight:700;color:var(--dim);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 6px}
input.t{width:100%;font:inherit;padding:13px 14px;border-radius:16px;border:2px solid transparent;background:var(--card);color:var(--txt);box-shadow:var(--sh)}
input.t:focus{outline:0;border-color:var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 2px transparent}
.sw.on{border-color:var(--bg);box-shadow:0 0 0 3px var(--txt)}
.emg{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;background:var(--card);border-radius:16px;padding:8px;max-height:150px;overflow:auto}
.emg button{font-size:24px;border-radius:12px;padding:4px 0}.emg button.on{background:var(--card2);box-shadow:inset 0 0 0 2px var(--ac)}
.chip{padding:9px 14px;border-radius:999px;background:var(--card);box-shadow:var(--sh);font-weight:600;font-size:14px}
.chip.on{background:var(--ac);color:#fff}
.wd{width:42px;height:42px;padding:0;border-radius:50%}
.btn{padding:14px;border-radius:18px;font-weight:700;width:100%;margin-top:10px;background:var(--card);box-shadow:var(--sh)}
.btn.pri{background:var(--ac);color:#fff}.btn.red{color:#e5484d}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tile{background:var(--card);border-radius:18px;padding:12px 14px;box-shadow:var(--sh)}
.tile b{display:block;font-size:24px;letter-spacing:-.02em}.tile span{font-size:12px;color:var(--dim);font-weight:600}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--card);padding:10px;border-radius:20px;box-shadow:var(--sh)}
.cal .hd{text-align:center;font-size:11px;font-weight:700;color:var(--dim)}
.cal .c{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--dim);cursor:pointer}
.cal .c.off{opacity:.3}.cal .c.ok{color:#fff}.cal .c.sk{border:2px dashed var(--dim)}.cal .c.miss{background:var(--card2)}.cal .c.td{box-shadow:0 0 0 2px var(--ac)}
.cal .c.fu{opacity:.25;cursor:default}
.mh{display:flex;align-items:center;justify-content:space-between;margin:14px 0 8px;font-weight:700}
.mh button{width:34px;height:34px;border-radius:50%;background:var(--card);box-shadow:var(--sh)}
.step{display:flex;align-items:center;justify-content:center;gap:18px;margin:12px 0}
.step button{width:48px;height:48px;border-radius:50%;background:var(--card);box-shadow:var(--sh);font-size:24px}
.step b{font-size:28px;min-width:90px;text-align:center}
/* stats */
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;background:var(--card);padding:12px;border-radius:20px;box-shadow:var(--sh)}
.bars div{flex:1;border-radius:6px 6px 3px 3px;background:var(--ac);min-height:3px}
.bl{display:flex;gap:6px;padding:0 12px;font-size:10px;color:var(--dim);margin-top:4px}.bl span{flex:1;text-align:center}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,auto);grid-auto-columns:1fr;gap:3px;background:var(--card);padding:12px;border-radius:20px;box-shadow:var(--sh)}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--card2)}
.rk{display:flex;align-items:center;gap:10px;background:var(--card);padding:10px 12px;border-radius:18px;box-shadow:var(--sh);margin-bottom:8px}
.rk .em{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}
.rk .tx{flex:1;min-width:0}.rk b{display:block;font-size:15px}.rk .pb{height:6px;border-radius:9px;background:var(--card2);margin-top:5px;overflow:hidden}.rk .pb i{display:block;height:100%;border-radius:9px}
.rk em{font-style:normal;font-weight:700;font-size:15px}
/* login */
.login{max-width:340px;margin:18vh auto 0;text-align:center}.login .logo{width:84px;height:84px;border-radius:26px;margin:0 auto 14px;display:block}
.err{color:#e5484d;font-size:14px;min-height:20px;margin-top:8px}
</style></head><body>
<main id="app"></main>
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const COLORS=["#3b82f6","#e84393","#ff7675","#fd9644","#f5b700","#2ecc71","#00b8a9","#0abde3","#4a7bff","#a0785a"];
const EMOJI="💧 🏃 🧘 📚 ✍️ 🛏️ 🥗 🍎 💊 🦷 🚿 🧹 🚭 🍷 📵 💻 🎸 🎨 🌱 🐕 🐈 ☀️ 🌙 🚴 🏋️ 🧠 🇨🇳 🎧 💰 📝 🙏 ☕ 🥤 🍳 🚶 🏊 🧴 📞 ❤️ ⭐ 🎯 🔥 🧺 🪥 🥛 😴 🌿 🕯️".split(" ");
const PER={morning:["Morning","🌅"],afternoon:["Afternoon","☀️"],evening:["Evening","🌙"],anytime:["Anytime","🕒"]};
const WD=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
let S=null,sel=null,tab="today",per="all",stripX=null,logs={},loaded=null,sheet=null;

const dt=d=>new Date(d+"T12:00:00Z"), iso=d=>d.toISOString().slice(0,10);
const add=(d,n)=>{const x=dt(d);x.setUTCDate(x.getUTCDate()+n);return iso(x)};
const wday=d=>(dt(d).getUTCDay()+6)%7;
const mon=d=>add(d,-wday(d));
const hex=(c,a)=>c+Math.round(a*255).toString(16).padStart(2,"0");

async function api(m,u,b){
  const r=await fetch(u,{method:m,headers:b?{"Content-Type":"application/json"}:{},body:b?JSON.stringify(b):undefined});
  if(r.status===401){S={edit:false};render();throw new Error("401")}
  if(!r.ok){let e="";try{e=(await r.json()).detail}catch(_){}throw new Error(e||r.status)}
  return r.json();
}
async function load(){
  S=await api("GET","/api/state");
  if(!S.edit){render();return}
  sel=sel||S.today;
  logs={};for(const [h,d,c,s] of S.logs)logs[h+"|"+d]=[c,s];
  loaded=S.logs_from;
  render();
}
async function ensureLogs(day){   // older than the state's window: fetch that week
  if(day>=loaded)return;
  const a=mon(day),b=add(a,6);
  const r=await api("GET",`/api/logs?start=${a}&end=${b}`);
  for(const [h,d,c,s] of r.logs)logs[h+"|"+d]=[c,s];
  for(const h of S.habits)for(let i=0;i<7;i++)if(!logs[h.id+"|"+add(a,i)])logs[h.id+"|"+add(a,i)]=null;
}
const lg=(h,d)=>logs[h.id+"|"+d]||[0,false];
const sched=(h,d)=>h.days.includes(String(wday(d)));
const isDone=(h,d)=>{const l=lg(h,d);return !l[1]&&l[0]>=h.goal};
function visible(d){return S.habits.filter(h=>{const l=lg(h,d);return (sched(h,d)&&d>=h.created.slice(0,10))||l[0]>0||l[1]})}
function dayProg(d){const v=visible(d).filter(h=>!lg(h,d)[1]);return [v.filter(h=>isDone(h,d)).length,v.length]}

function ring(p,size,w,col,track){
  const r=(size-w)/2,c=2*Math.PI*r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${w}"/>
  <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${c*Math.min(p,1)} ${c}" transform="rotate(-90 ${size/2} ${size/2})" style="transition:stroke-dasharray .4s"/></svg>`;
}
const IC={
 today:'<svg class="i" viewBox="0 0 24 24"><rect x="4.5" y="4.5" width="15" height="15" rx="4"/><path d="M9 12.2l2.2 2.2L15.2 10"/></svg>',
 list:'<svg class="i" viewBox="0 0 24 24"><path d="M9 7h11M9 12h11M9 17h11M4.5 7h.01M4.5 12h.01M4.5 17h.01"/></svg>',
 stats:'<svg class="i" viewBox="0 0 24 24"><path d="M6 19.5V11M12 19.5V4.5M18 19.5v-6.5"/></svg>',
 gear:'<svg class="i" viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.3"/><circle cx="8" cy="17" r="2.3"/></svg>'};
const PF=[["all","All Day"],["morning","Morning"],["afternoon","Afternoon"],["evening","Evening"]];
function scene(){
  return `<svg class="scene" viewBox="0 0 390 128" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <path d="M0 78 C50 52 100 52 150 70 C210 92 270 48 330 62 C360 69 378 74 390 70 L390 128 L0 128Z" fill="#212123"/>
  <ellipse cx="72" cy="62" rx="26" ry="16" fill="#252527"/><ellipse cx="120" cy="58" rx="22" ry="14" fill="#232325"/><ellipse cx="258" cy="56" rx="30" ry="17" fill="#252527"/><ellipse cx="322" cy="60" rx="24" ry="14" fill="#232325"/>
  <path d="M0 104 C70 80 140 96 210 92 C280 88 340 76 390 90 L390 128 L0 128Z" fill="#1d1d1f"/>
  <g><rect x="68" y="88" width="3" height="14" fill="#1f4f4b"/><circle cx="69.5" cy="82" r="10" fill="#2f8f86"/></g>
  <g><rect x="298" y="86" width="3" height="16" fill="#1f4f4b"/><circle cx="299.5" cy="78" r="12" fill="#2a9a8c"/></g>
  <g><rect x="238" y="94" width="2.5" height="10" fill="#1f4f4b"/><circle cx="239" cy="90" r="7" fill="#2f8f86"/></g>
  <g><rect x="176" y="86" width="2.5" height="10" fill="#1f4f4b"/><path d="M177 66l-7 20h14z" fill="#276f69"/></g>
  <path d="M146 24q4-5 8 0q4-5 8 0" fill="none" stroke="#d9b24a" stroke-width="2" stroke-linecap="round"/>
  <path d="M206 44q3-4 6 0q3-4 6 0" fill="none" stroke="#d9b24a" stroke-width="2" stroke-linecap="round"/></svg>`;
}
function render(){
  const a=$("#app");
  if(!S){a.innerHTML="";return}
  if(!S.edit){
    a.innerHTML=`<div class="login"><img class="logo" src="/static/icons/icon-192.png" alt=""><h1 style="margin:0 0 4px">Habits</h1><p style="color:var(--dim);margin:0 0 18px">Sign in to continue</p>
    <input class="t" id="pw" type="password" placeholder="Password" autocomplete="current-password"><button class="btn pri" id="go">Sign in</button><div class="err" id="er"></div></div>`;
    const go=async()=>{try{await api("POST","/api/login",{password:$("#pw").value});await load()}catch(e){$("#er").textContent="Wrong password"}};
    $("#go").onclick=go;$("#pw").onkeydown=e=>{if(e.key==="Enter")go()};return;
  }
  const T=(t,ic,l)=>`<button class="tab ${tab===t?"on":""}" data-t="${t}">${ic}${l}</button>`;
  a.innerHTML=(tab==="today"?viewToday():tab==="habits"?viewHabits():viewStats())+`<nav><div>${T("today",IC.today,"Today")}${T("habits",IC.list,"Habits")}
    <button class="plus" id="new" aria-label="New habit">+</button>${T("stats",IC.stats,"Stats")}<button class="tab" data-cog>${IC.gear}Settings</button></div></nav>`;
  a.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();scrollTo(0,0)});
  $("#new").onclick=()=>openEdit(null);
  if(tab==="today")bindToday();
  if(tab==="habits")bindHabits();
  const st=$("#strip");if(st){st.scrollLeft=stripX==null?st.scrollWidth:stripX;st.onscroll=()=>{stripX=st.scrollLeft}}
  const sh=$(".ov");if(sh)sh.remove();
  if(sheet)sheet();
}
function topbar(title,left){return `<div class="top">${left||`<span class="ib"></span>`}<h1>${title}</h1><button class="ib" data-cog aria-label="Settings">${IC.gear}</button></div>`}
function viewToday(){
  const d=sel,from=add(S.today,-120);
  const title=d===S.today?"Today":dt(d).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"});
  let h=topbar(title,`<button class="ib" data-t="habits" aria-label="Habits">${IC.list}</button>`)+`<div class="strip" id="strip">`;
  for(let i=0;i<=121;i++){const x=add(from,i);h+=`<button class="dy ${x===d?"sel":""} ${x>S.today?"fut":""}" data-d="${x}"><span>${WD[wday(x)].slice(0,2)}</span><b>${+x.slice(8)}</b></button>`}
  h+=`</div>${scene()}<div class="pf">${PF.map(([k,l])=>`<button class="${k===per?"on":""}" data-pf="${k}">${l}</button>`).join("")}</div>`;
  const vis=visible(d).filter(x=>per==="all"||x.period===per||x.period==="anytime");
  if(!S.habits.length)h+=`<div class="empty"><big>🌱</big>No habits yet.<br>Tap the + to start your first one.</div>`;
  else if(!vis.length)h+=`<div class="empty"><big>😌</big>Nothing scheduled here.</div>`;
  for(const x of vis)h+=card(x,d);
  return h;
}
function card(h,d){
  const l=lg(h,d),dn=isDone(h,d),sk=l[1];
  const sub=sk?"Skipped":h.total===0?"New":`${h.streak} day${h.streak===1?"":"s"}`;
  const cnt=sk?`<b style="color:var(--dim)">–</b><small>skipped</small>`
    :`<b style="color:${dn?"#30d158":h.color}">${l[0]}</b><i style="color:${dn?"#30d15888":hex(h.color,.5)}">/${h.goal}</i><small>${esc(h.unit||"times")}</small>`;
  return `<div class="h ${dn?"done":""} ${sk?"skip":""}" data-id="${h.id}"><button class="tx" data-open="${h.id}"><span class="em">${esc(h.emoji)}</span>
  <span class="nm"><b>${esc(h.name)}</b><small><i>★</i>${sub}</small></span></button><button class="cnt" data-ck="${h.id}" aria-label="Add one">${cnt}</button></div>`;
}
function bindToday(){
  document.querySelectorAll(".dy").forEach(b=>b.onclick=()=>{if(b.dataset.d<=S.today)go(b.dataset.d)});
  document.querySelectorAll("[data-pf]").forEach(b=>b.onclick=()=>{per=b.dataset.pf;render()});
  document.querySelectorAll("[data-ck]").forEach(b=>b.onclick=e=>tap(+b.dataset.ck,e));
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openDetail(+b.dataset.open));
}
const daysText=x=>x.days==="0123456"?"Every day":x.days.split("").map(i=>WD[i]).join(", ");
function viewHabits(){
  let h=topbar("Habits");
  if(!S.habits.length)return h+`<div class="empty"><big>🌱</big>No habits yet.<br>Tap the + to start your first one.</div>`;
  S.habits.forEach((x,i)=>{
    h+=`<div class="h mg"><button class="tx" data-edit="${x.id}"><span class="em">${esc(x.emoji)}</span><span class="nm"><b>${esc(x.name)}</b><small>${daysText(x)} · ${PER[x.period][0]}${x.goal>1?` · ${x.goal} ${esc(x.unit||"times")}`:""}</small></span></button>
    <div class="mv"><button data-mv="${x.id}" data-dir="-1" ${i?"":"disabled"} aria-label="Move up">▲</button><button data-mv="${x.id}" data-dir="1" ${i<S.habits.length-1?"":"disabled"} aria-label="Move down">▼</button></div></div>`;
  });
  return h;
}
function bindHabits(){
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openEdit(S.habits.find(x=>x.id===+b.dataset.edit)));
  document.querySelectorAll("[data-mv]").forEach(b=>b.onclick=async()=>{
    const ids=S.habits.map(x=>x.id),i=ids.indexOf(+b.dataset.mv),j=i+ +b.dataset.dir;if(j<0||j>=ids.length)return;
    [ids[i],ids[j]]=[ids[j],ids[i]];await api("POST","/api/habits/order",{ids});await refresh();
  });
}
async function go(d){await ensureLogs(d);sel=d;render()}
function confetti(el,col){
  const r=el.getBoundingClientRect();
  for(let i=0;i<16;i++){
    const s=document.createElement("span");s.className="cf";
    const a=Math.random()*6.28,k=30+Math.random()*40;
    s.style.cssText=`position:fixed;left:${r.left+r.width/2}px;top:${r.top+r.height/2}px;background:${i%3?col:COLORS[i%COLORS.length]};--x:${Math.cos(a)*k}px;--y:${Math.sin(a)*k}px`;
    document.body.appendChild(s);setTimeout(()=>s.remove(),750);
  }
}
async function setCount(h,d,n,opts){
  const c=Math.max(0,n),was=isDone(h,d);
  logs[h.id+"|"+d]=c||opts?.skipped?[c,!!opts?.skipped]:null;
  const body={habit_id:h.id,day:d,count:c};if(opts?.skipped!==undefined)body.skipped=opts.skipped;
  const p=api("POST","/api/log",body);
  return {p,became:!was&&isDone(h,d)};
}
async function tap(id,ev){
  const h=S.habits.find(x=>x.id===id),d=sel,l=lg(h,d);
  const n=h.goal===1?(isDone(h,d)?0:1):(l[0]>=h.goal&&!l[1]?0:l[0]+1);
  const btn=ev.currentTarget,{p,became}=await setCount(h,d,n);
  render();
  if(became){const b=document.querySelector(`[data-ck="${id}"]`);if(b){b.classList.add("pop");confetti(b,h.color)}}
  if(navigator.vibrate)navigator.vibrate(became?25:8);
  try{await p}catch(e){}
  const keep=sel;await refresh();sel=keep;
}
async function refresh(){   // reload the server numbers (streaks, summary) without losing the page state
  const t=document.scrollingElement.scrollTop,s=sheet;const keepLogs={...logs};
  const st=await api("GET","/api/state");S=st;logs={...keepLogs};
  for(const [h,d,c,sk] of S.logs)logs[h+"|"+d]=[c,sk];
  sheet=s;render();document.scrollingElement.scrollTop=t;
}
/* ---------- detail sheet ---------- */
let dId=null,dMonth=null,dLogs={};
async function openDetail(id){
  dId=id;dMonth=sel.slice(0,7);dLogs={};
  const h=S.habits.find(x=>x.id===id);
  const r=await api("GET",`/api/logs?start=${add(S.today,-399)}&end=${S.today}&habit_id=${id}`);
  for(const [,d,c,s] of r.logs)dLogs[d]=[c,s];
  sheet=detailSheet;render();
}
function detailSheet(){
  const h=S.habits.find(x=>x.id===dId);if(!h){sheet=null;return}
  const ov=document.createElement("div");ov.className="ov";
  const [y,m]=dMonth.split("-").map(Number),first=`${dMonth}-01`,off=wday(first),dim=new Date(Date.UTC(y,m,0)).getUTCDate();
  const nm=dt(first).toLocaleDateString("en-GB",{month:"long",year:"numeric",timeZone:"UTC"});
  let cal=WD.map(w=>`<div class="hd">${w[0]}</div>`).join("")+"<i></i>".repeat(off);
  for(let i=1;i<=dim;i++){
    const d=`${dMonth}-${String(i).padStart(2,"0")}`,l=dLogs[d]||[0,false],fu=d>S.today,ok=!l[1]&&l[0]>=h.goal;
    const cls=fu?"fu":ok?"ok":l[1]?"sk":sched(h,d)&&d>=h.created.slice(0,10)&&d<S.today?"miss":!sched(h,d)?"off":"";
    cal+=`<div class="c ${cls} ${d===S.today?"td":""}" data-day="${fu?"":d}" ${ok?`style="background:${h.color}"`:""}>${i}</div>`;
  }
  const d=sel,l=lg(h,d),multi=h.goal>1;
  ov.innerHTML=`<div class="sheet"><h2><span style="font-size:30px">${esc(h.emoji)}</span>${esc(h.name)}<button class="x" id="cl">✕</button></h2>
  <div class="tiles"><div class="tile"><b>🔥 ${h.streak}</b><span>Current streak</span></div><div class="tile"><b>🏆 ${h.best}</b><span>Best streak</span></div>
  <div class="tile"><b>${h.total}</b><span>Times completed</span></div><div class="tile"><b>${h.rate==null?"–":h.rate+"%"}</b><span>Completion rate</span></div></div>
  ${multi?`<div class="step"><button id="mn">−</button><b>${l[0]} / ${h.goal}<br><small style="font-size:12px;color:var(--dim);font-weight:600">${esc(h.unit)}</small></b><button id="pl">+</button></div>`:""}
  <div class="mh"><button id="pm">‹</button>${nm}<button id="nm_">›</button></div><div class="cal">${cal}</div>
  <p style="color:var(--dim);font-size:12px;margin:8px 4px">Tap a day to toggle it. ${multi?"Taps on the calendar complete the whole goal.":""}</p>
  <button class="btn" id="skp">${l[1]?"Undo skip":"Skip "+(d===S.today?"today":"this day")+" (keeps streak)"}</button>
  <button class="btn" id="ed">✏️ Edit habit</button></div>`;
  document.body.appendChild(ov);
  const close=()=>{sheet=null;ov.remove()};
  ov.onclick=e=>{if(e.target===ov)close()};$("#cl").onclick=close;
  $("#pm").onclick=()=>{dMonth=add(`${dMonth}-01`,-1).slice(0,7);ov.remove();detailSheet()};
  $("#nm_").onclick=()=>{const n=add(`${dMonth}-28`,5).slice(0,7);if(n<=S.today.slice(0,7)){dMonth=n;ov.remove();detailSheet()}};
  ov.querySelectorAll("[data-day]").forEach(c=>c.onclick=async()=>{
    const day=c.dataset.day;if(!day)return;
    const ok=!(dLogs[day]||[0,false])[1]&&(dLogs[day]||[0])[0]>=h.goal,n=ok?0:h.goal;
    dLogs[day]=n?[n,false]:[0,false];logs[h.id+"|"+day]=n?[n,false]:null;
    await api("POST","/api/log",{habit_id:h.id,day,count:n});await refresh();
  });
  if(multi){$("#mn").onclick=()=>step(h,d,l[0]-1);$("#pl").onclick=()=>step(h,d,l[0]+1)}
  $("#skp").onclick=async()=>{await api("POST","/api/log",{habit_id:h.id,day:d,skipped:!l[1]});dLogs[d]=null;delete logs[h.id+"|"+d];
    const r=await api("GET",`/api/logs?start=${d}&end=${d}&habit_id=${h.id}`);for(const [,dd,c,s] of r.logs){dLogs[dd]=[c,s];logs[h.id+"|"+dd]=[c,s]}await refresh()};
  $("#ed").onclick=()=>{close();openEdit(h)};
}
async function step(h,d,n){
  n=Math.max(0,Math.min(n,h.goal*3));dLogs[d]=n?[n,false]:null;logs[h.id+"|"+d]=n?[n,false]:null;
  await api("POST","/api/log",{habit_id:h.id,day:d,count:n});await refresh();
}
/* ---------- add / edit ---------- */
function openEdit(h){
  const f=h?{...h}:{name:"",emoji:"💧",color:COLORS[0],period:"anytime",days:"0123456",goal:1,unit:""};
  sheet=()=>{
    const ov=document.createElement("div");ov.className="ov";
    ov.innerHTML=`<div class="sheet"><h2>${h?"Edit habit":"New habit"}<button class="x" id="cl">✕</button></h2>
    <input class="t" id="nm" placeholder="Habit name, e.g. Drink water" maxlength="60" value="${esc(f.name)}">
    <label class="l">Icon</label><div class="emg">${EMOJI.map(e=>`<button data-e="${e}" class="${e===f.emoji?"on":""}">${e}</button>`).join("")}</div>
    <label class="l">Colour</label><div class="row">${COLORS.map(c=>`<button class="sw ${c===f.color?"on":""}" data-c="${c}" style="background:${c}" aria-label="${c}"></button>`).join("")}</div>
    <label class="l">Time of day</label><div class="row">${Object.entries(PER).map(([k,v])=>`<button class="chip ${k===f.period?"on":""}" data-p="${k}">${v[1]} ${v[0]}</button>`).join("")}</div>
    <label class="l">Repeat on</label><div class="row">${WD.map((w,i)=>`<button class="chip wd ${f.days.includes(i)?"on":""}" data-w="${i}">${w[0]}${w[1]}</button>`).join("")}</div>
    <label class="l">Daily goal</label><div class="row" style="align-items:center"><input class="t" id="gl" type="number" min="1" max="999" value="${f.goal}" style="width:90px"><input class="t" id="un" placeholder="unit, e.g. glasses" maxlength="20" value="${esc(f.unit)}" style="flex:1"></div>
    <div class="err" id="er"></div>
    <button class="btn pri" id="sv">${h?"Save":"Create habit"}</button>${h?`<button class="btn red" id="dl">Delete habit</button>`:""}</div>`;
    document.body.appendChild(ov);
    const close=()=>{sheet=null;ov.remove()};
    ov.onclick=e=>{if(e.target===ov)close()};$("#cl").onclick=close;
    const sync=()=>{f.name=$("#nm").value;f.goal=+$("#gl").value||1;f.unit=$("#un").value};
    const redo=()=>{sync();ov.remove();sheet();};
    ov.querySelectorAll("[data-e]").forEach(b=>b.onclick=()=>{f.emoji=b.dataset.e;redo()});
    ov.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{f.color=b.dataset.c;redo()});
    ov.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{f.period=b.dataset.p;redo()});
    ov.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{const i=b.dataset.w;f.days=f.days.includes(i)?f.days.replace(i,""):f.days+i;redo()});
    $("#sv").onclick=async()=>{
      sync();if(!f.name.trim()){$("#er").textContent="Give your habit a name";return}
      try{await api("POST",h?"/api/habit/"+h.id:"/api/habit",{name:f.name,emoji:f.emoji,color:f.color,period:f.period,days:f.days,goal:f.goal,unit:f.unit});sheet=null;await refresh()}
      catch(e){$("#er").textContent=e.message}
    };
    if(h)$("#dl").onclick=async()=>{if(confirm(`Delete "${h.name}" and all its history?`)){await api("DELETE","/api/habit/"+h.id);sheet=null;await refresh()}};
  };
  sheet();
}
function settingsSheet(){
  const ov=document.createElement("div");ov.className="ov";
  ov.innerHTML=`<div class="sheet"><h2>Settings<button class="x" id="cl">✕</button></h2>
  <label class="l">Change password</label><input class="t" id="cu" type="password" placeholder="Current password" autocomplete="current-password" style="margin-bottom:8px">
  <input class="t" id="nw" type="password" placeholder="New password (min 8 characters)" autocomplete="new-password"><div class="err" id="er"></div>
  <button class="btn" id="cp">Change password</button><button class="btn red" id="lo">Sign out</button></div>`;
  document.body.appendChild(ov);
  const close=()=>{sheet=null;ov.remove()};ov.onclick=e=>{if(e.target===ov)close()};$("#cl").onclick=close;
  $("#cp").onclick=async()=>{try{await api("POST","/api/password",{current:$("#cu").value,new:$("#nw").value});$("#er").style.color="#2ecc71";$("#er").textContent="Password changed"}catch(e){$("#er").style.color="";$("#er").textContent=e.message}};
  $("#lo").onclick=async()=>{await fetch("/api/logout",{method:"POST"});sheet=null;S={edit:false};render()};
}
/* ---------- stats ---------- */
function viewStats(){
  const days=S.days,map=Object.fromEntries(days.map(x=>[x[0],x]));
  const perfect=days.filter(x=>x[1]===x[2]).length;
  const last30=days.filter(x=>x[0]>add(S.today,-30)),avg=last30.length?Math.round(100*last30.reduce((a,x)=>a+x[1]/x[2],0)/last30.length):0;
  let ps=0;for(let i=0;i<400;i++){const x=map[add(S.today,-i)];if(!x)continue;if(x[1]===x[2])ps++;else if(i>0)break}
  const checks=days.reduce((a,x)=>a+x[1],0);
  let h=topbar("Stats")+`
  <div class="tiles"><div class="tile"><b>${avg}%</b><span>Avg. completion, 30 days</span></div><div class="tile"><b>🔥 ${ps}</b><span>Perfect-day streak</span></div>
  <div class="tile"><b>${perfect}</b><span>Perfect days</span></div><div class="tile"><b>${checks}</b><span>Total check-ins</span></div></div>`;
  const wk=mon(S.today);let bars="",lbl="";
  for(let i=11;i>=0;i--){
    const a=add(wk,-7*i),xs=[];for(let j=0;j<7;j++){const x=map[add(a,j)];if(x)xs.push(x[1]/x[2])}
    const v=xs.length?xs.reduce((p,q)=>p+q,0)/xs.length:0;
    bars+=`<div style="height:${Math.max(3,v*100)}%" title="${Math.round(v*100)}%"></div>`;lbl+=`<span>${+a.slice(8)}/${+a.slice(5,7)}</span>`;
  }
  h+=`<div class="sec">Weekly completion</div><div class="bars">${bars}</div><div class="bl">${lbl}</div>`;
  let cells="";const st=add(wk,-7*25);
  for(let i=0;i<26*7;i++){
    const d=add(st,i);if(d>S.today){cells+=`<i style="opacity:0"></i>`;continue}
    const x=map[d],p=x?x[1]/x[2]:-1;
    cells+=`<i title="${d}" style="${p<0?"":`background:${hex("#3b82f6",p===0?.12:.25+.75*p)}`}"></i>`;
  }
  h+=`<div class="sec">Last 26 weeks</div><div class="heat">${cells}</div><div class="sec">Habits</div>`;
  if(!S.habits.length)h+=`<div class="empty">No habits yet.</div>`;
  for(const x of [...S.habits].sort((a,b)=>(b.rate??-1)-(a.rate??-1)))
    h+=`<div class="rk"><div class="em" style="background:${hex(x.color,.18)}">${esc(x.emoji)}</div><div class="tx"><b>${esc(x.name)}</b><span style="font-size:12px;color:var(--dim)">🔥 ${x.streak} · best ${x.best} · ${x.total}×</span>
    <div class="pb"><i style="width:${x.rate||0}%;background:${x.color}"></i></div></div><em>${x.rate==null?"–":x.rate+"%"}</em></div>`;
  return h;
}
document.addEventListener("click",e=>{if(e.target.closest&&e.target.closest("[data-cog]")){sheet=settingsSheet;render()}});
load().catch(()=>{});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S&&S.edit&&!sheet)refresh().catch(()=>{})});
</script></body></html>
